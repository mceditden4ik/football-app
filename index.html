<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="fb-static" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Football Value</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#090d16;--bg2:#0d1321;--card:#131b2b;--card2:#1b2539;--line:#28354f;--text:#ecf1fa;--muted:#8c99b5;--dim:#626e8a;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--blue:#6096ff;--violet:#a78bfa;--track:#212d45;
  --r:20px;--pad:16px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden;
  background:radial-gradient(900px 340px at 50% -80px,rgba(96,150,255,.16),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}
h1{font-size:22px;margin:18px 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 .grow{flex:1}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)} .g{color:var(--green)} .r{color:var(--red)} .a{color:var(--amber)} .b{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.note b{color:var(--muted)}

/* ── анимации ── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.0)}50%{box-shadow:0 0 0 5px rgba(52,211,153,.18)}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.view{animation:fade .25s ease both}
.view.fwd{animation:slidein .32s var(--ease) both}
.view>*,.stag>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.pbar i,.meter i,.tb i{transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:.12s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .15s forwards}
.area{animation:fade .9s ease .5s both}
.row,.card.tap,.chip,.seg button,.nav button,.star{transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s}
.row:active,.card.tap:active{transform:scale(.985)}
.chip:active,.star:active{transform:scale(.93)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* навигация */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,19,33,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;padding:8px 4px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.nav button.on{color:var(--text);background:var(--card2)}
.nav button.on svg{transform:translateY(-1px) scale(1.12)}

/* фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px var(--pad) 10px;scrollbar-width:none;margin:0 calc(-1*var(--pad))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--card2);color:var(--text);border-color:var(--blue)}
.chip.fav.on{border-color:var(--amber);color:var(--amber)}
.chip.rec.on{border-color:var(--green);color:var(--green)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:11px;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:var(--text)}
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:10px;outline:0;transition:border-color .2s}
.search:focus{border-color:var(--blue)}
.tools{display:flex;gap:8px;align-items:center;margin:-2px 0 6px;flex-wrap:wrap}
.tools .sp{flex:1}
.sort{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.sort button{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.sort button.on{background:var(--card2);color:var(--text)}
.snapnote{font-size:12px;color:var(--dim);margin:6px 2px 12px;text-align:center}
.snapnote.warn{color:var(--amber)}
.iconbtn.lang{font-size:11px;font-weight:800;letter-spacing:.3px;color:var(--text);margin-right:8px}
.today .tp{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.today .tpm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:spin .8s linear infinite}

/* список матчей */
.day{margin:16px 2px 8px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.row:active{background:var(--card2)}
.row .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;gap:8px}
.row .top .eta{color:var(--blue);font-weight:600}
.teams{font-weight:700;font-size:16px;line-height:1.25}
.teams span{display:block}
.teams .fv{color:var(--amber);font-size:13px;margin-right:4px}
.pbar{display:flex;gap:3px;height:6px;margin:10px 0 6px;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%}
.pnum{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.bg-g{background:rgba(52,211,153,.14);color:var(--green)} .bg-a{background:rgba(251,191,36,.14);color:var(--amber)}
.bg-r{background:rgba(248,113,113,.14);color:var(--red)} .bg-b{background:rgba(96,150,255,.16);color:var(--blue)} .bg-m{background:var(--card2);color:var(--muted)}
.bg-g.pulse{animation:pulse 2.2s ease-in-out infinite}
html[data-theme=light]{--bg:#f3f5fa;--bg2:#e9edf5;--card:#ffffff;--card2:#eef2f9;--line:#d5dcea;--text:#141b2d;--muted:#5b6784;--dim:#8792ad;
  --green:#0f9f6e;--red:#d64545;--amber:#b7791f;--blue:#2f6bff;--violet:#7c5cf0;--track:#e1e7f2}
html[data-theme=light] body{background:radial-gradient(900px 340px at 50% -80px,rgba(47,107,255,.10),transparent 70%),var(--bg)}
.fd{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:4px;font-size:11px;font-weight:800;line-height:22px;text-align:center;color:#06101f}
.fd.W{background:var(--green)}.fd.D{background:var(--amber)}.fd.L{background:var(--red)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.tbl td.me,.tbl tr.me td{font-weight:800;color:var(--blue)}
.nbox{margin-top:8px}.nbox textarea{width:100%;min-height:54px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;resize:vertical}
.nlink{color:var(--blue);font-size:12px;margin-top:6px;display:inline-block}
.ntxt{margin-top:6px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.score{font-weight:700;font-size:20px;margin-top:8px;letter-spacing:.04em}
.pause{color:var(--amber,#e0a030)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1.2s infinite}

/* страница матча */
.hero{text-align:center;padding:20px 12px 18px;position:relative}
.hero .lg{display:inline-block;margin-bottom:10px}
.hero .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.hero .vs .at{margin-top:18px}
.mono{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:800;font-size:19px;border:2px solid currentColor;background:rgba(255,255,255,.04)}
.hero .tn.lg{font-size:15px}
.hero .tn .star{width:26px;height:26px}
.hero .tn{font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.hero .xg{font-size:12px;color:var(--muted);margin-top:4px}
.hero .at{color:var(--dim);font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.star{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--dim);margin-left:2px;vertical-align:middle}
.star svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.star.on{color:var(--amber)} .star.on svg{fill:currentColor}
.star.pop svg{animation:pop .4s var(--ease)}
.eta-big{margin-top:12px;font-size:13px;color:var(--blue);font-weight:700}
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.probs .p{font-size:clamp(22px,7.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.probs .k{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.probs .f{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;margin:0 0 12px}
.actions button{flex:1;padding:11px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px}
.actions button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions button:active{background:var(--card2);transform:scale(.97)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .v{font-weight:800;font-size:18px;margin:6px 0 2px}
.dots{display:flex;gap:5px;margin-top:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mk>div{background:var(--card2);border-radius:14px;padding:11px 12px}
.mk .t{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.mk .s{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px;font-weight:800}
.mk .s b{font-size:22px}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;border-radius:3px}
.mk .n{font-size:11px;font-weight:700;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}tr:last-child td{border-bottom:0}
.bet{border-left:4px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.bet:last-child{margin-bottom:0}.bet.rec{border-color:var(--green)}.bet.sk{border-color:var(--dim)}
.bet .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}.bet .h .o{flex:none;white-space:nowrap}.bet .mt{font-size:13px;color:var(--muted);margin-top:2px}
.bet .m{font-size:12.5px;color:var(--muted);margin-top:3px}

/* матрица счёта */
.hm{display:grid;grid-template-columns:22px repeat(6,1fr);gap:4px;margin-top:12px;font-size:12px}
.hm .ax{display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:11px}
.hm .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:var(--text);background:rgba(96,150,255,var(--a));border:1px solid transparent;cursor:pointer;transition:transform .15s,border-color .2s}
.hm .c.top{border-color:var(--amber)}
.hm .c.sel{border-color:var(--text);transform:scale(1.08);z-index:1}
.hm-info{margin-top:10px;min-height:20px;font-weight:700;font-size:14px;text-align:center}
.hm-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:10px 0 -4px 26px}
.tb{display:grid;grid-template-columns:34px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.tb .bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}.tb .bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
/* сравнение команд */
.cmp{margin-top:12px}
.cmp .r1{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.cmp .r1 .l{text-align:center;font-weight:600;font-size:12px;color:var(--muted)}
.cmp .r1 span:first-child{text-align:left}.cmp .r1 span:last-child{text-align:right}
.cmp .big{color:var(--text)}.cmp .small{color:var(--muted);font-weight:600}
.cmp .sp{display:flex;gap:3px;height:6px;margin:5px 0 12px;border-radius:3px;overflow:hidden}
.cmp .sp i{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
/* калькулятор */
.calc{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:10px}
.calc select,.calc input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);outline:0;min-width:0}
.calc input:focus,.calc select:focus{border-color:var(--blue)}
.calc-out{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-out>div{background:var(--card2);border-radius:12px;padding:10px 12px}
.calc-out .v{font-weight:800;font-size:18px;margin-top:3px}

/* статистика */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi .tile .v{font-size:26px}
.alert{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.alert.ok{border-left-color:var(--green)} .alert.neutral{border-left-color:var(--amber)}
.seg-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.seg-row:last-child{border-bottom:0}
.chartbox{position:relative;touch-action:pan-y}
svg.chart{width:100%;height:auto;display:block}
.tip{position:absolute;top:0;transform:translate(-50%,-6px);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.sumrow .badge{font-size:12px;padding:5px 11px;text-transform:none;letter-spacing:0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.skel{height:92px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--dim);font-size:12px;margin:18px 0}
.err{padding:28px 18px;text-align:center;margin-top:48px}
.err b{display:block;font-size:17px;margin-bottom:8px}
.btn{background:var(--blue);color:#06101f;font-weight:700;border-radius:12px;padding:10px 18px;margin-top:12px}
#ptr{position:fixed;top:8px;left:50%;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;
  opacity:0;pointer-events:none;z-index:30;transform:translateY(-60px)}
#ptr svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round}
#ptr.spin svg{animation:spin .7s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-weight:600;font-size:13px;z-index:40;display:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{display:block;animation:toastin .25s var(--ease) both}

/* ═════════ v26 «Эффекты»: живой фон, стекло, подсветка, акценты ═════════ */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ang{to{--ang:360deg}}
@keyframes rip{from{transform:scale(0);opacity:.35}to{transform:scale(1);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:none}
html[data-fx="on"] #fx{display:block}
html[data-fx="on"] body{background:none}
/* стекло: карточки полупрозрачные, фон просвечивает */
html[data-fx="on"] .card,html[data-fx="on"] .tile,html[data-fx="on"] .row,html[data-fx="on"] .seg,html[data-fx="on"] .chip,html[data-fx="on"] .search{
  background:color-mix(in srgb,var(--card) 70%,transparent)}
html[data-fx="on"] .nav{background:color-mix(in srgb,var(--bg2) 72%,transparent)}
html[data-fxl="max"] .card,html[data-fxl="max"] .tile,html[data-fxl="max"] .row{-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
html[data-fx="on"] .card,html[data-fx="on"] .tile,html[data-fx="on"] .row{border-color:color-mix(in srgb,var(--text) 10%,transparent);box-shadow:0 8px 28px -14px rgba(0,0,0,.55),inset 0 1px 0 color-mix(in srgb,var(--text) 7%,transparent)}
/* световое пятно под пальцем */
.card,.row,.tile{position:relative}
.card::after,.row::after,.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--blue) 28%,transparent),transparent 65%)}
html[data-fx="on"] .lit::after{opacity:1}
/* бегущий свет по рамке плиток KPI */
html[data-fxl="max"] .tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 72%,var(--blue) 86%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:ang 7s linear infinite;opacity:.9}
/* волна при нажатии */
.rip-host{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--blue) 55%,#fff);pointer-events:none;animation:rip .6s var(--ease) forwards}
html[data-fxl="off"] .rip{display:none}
/* заголовки с мягким градиентом */
html[data-fx="on"] h1{background:linear-gradient(92deg,var(--text) 30%,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html[data-fx="on"] h1 .iconbtn,html[data-fx="on"] h1 .badge{-webkit-text-fill-color:currentColor}
/* оформление: выбор фона и акцента */
.bgpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.bgpick button{aspect-ratio:1;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding:4px;text-shadow:0 1px 3px rgba(0,0,0,.7);transition:transform .2s var(--ease),border-color .2s}
.bgpick button.on{border-color:var(--text);transform:scale(1.06)}
.bgpick .b-aurora{background:radial-gradient(circle at 25% 30%,#2dd4bf,transparent 55%),radial-gradient(circle at 75% 35%,#7c5cf0,transparent 55%),radial-gradient(circle at 50% 90%,#2f6bff,transparent 60%),#0a1020}
.bgpick .b-nebula{background:radial-gradient(circle at 30% 70%,#c026d3,transparent 55%),radial-gradient(circle at 70% 25%,#3b82f6,transparent 55%),#070816}
.bgpick .b-grid{background:linear-gradient(#0b0620 45%,#ff2fa0 46%,#1b0b3c 47%),#0b0620}
.bgpick .b-pitch{background:radial-gradient(circle at 20% 0,#fff6,transparent 45%),radial-gradient(circle at 85% 0,#fff5,transparent 45%),#0a3b2a}
.bgpick .b-off{background:var(--card2);color:var(--muted);text-shadow:none}
.accpick{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.accpick button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bg);transition:transform .2s var(--ease)}
.accpick button.on{border-color:var(--text);transform:scale(1.15)}

/* ═════════ v27: живые матчи, кольцо вероятностей, плавающая навигация, недели ═════════ */
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.0),inset 0 0 0 1px rgba(52,211,153,.35)}50%{box-shadow:0 0 22px 2px rgba(52,211,153,.22),inset 0 0 0 1px rgba(52,211,153,.7)}}
@keyframes htpulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(251,191,36,.30)}50%{box-shadow:0 0 18px 1px rgba(251,191,36,.18),inset 0 0 0 1px rgba(251,191,36,.6)}}
.row{transition:height .55s cubic-bezier(.4,0,.2,1),opacity .45s,transform .55s,margin .55s,padding .55s}
.row.leaving{opacity:0;transform:scale(.94) translateX(40px);height:0!important;margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;overflow:hidden;border-width:0;pointer-events:none}
.row.is-done{opacity:.72}
.nowhead{display:flex;align-items:center;gap:8px;color:#34d399}
.row.is-live{animation:livepulse 2.2s ease-in-out infinite}
.row.is-ht{animation:htpulse 2.6s ease-in-out infinite}
html[data-fxl="off"] .row.is-live,html[data-fxl="off"] .row.is-ht{animation:none;box-shadow:inset 0 0 0 1px rgba(52,211,153,.5)}
@keyframes ringdraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes ringpop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.ring{display:block;margin:14px auto 2px;width:190px;height:190px;overflow:visible}
.ring .rseg{fill:none;stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--len) 999;stroke-dashoffset:var(--len);animation:ringdraw 1.1s var(--ease) forwards;animation-delay:var(--d,0s);filter:drop-shadow(0 0 6px var(--gl))}
.ring .trk{fill:none;stroke:var(--track);stroke-width:13;opacity:.6}
.ring .ctr{animation:ringpop .6s var(--ease) .5s both;transform-origin:center}
.ring .big{font-size:30px;font-weight:800;fill:var(--text)}
.ring .lab{font-size:12px;fill:var(--muted);letter-spacing:.06em}
.ringleg{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin-bottom:4px}
.ringleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* плавающая «пилюля» активной вкладки */
.nav{position:fixed}
.nav .pill{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom));left:0;width:0;border-radius:14px;background:var(--card2);z-index:0;transition:transform .45s cubic-bezier(.3,1.35,.5,1),width .3s var(--ease);pointer-events:none;box-shadow:0 0 18px -4px var(--blue)}
.nav.has-pill button{position:relative;z-index:1}
.nav.has-pill button.on{background:transparent}
@keyframes tabL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.view.bwd{animation:tabL .32s var(--ease) both}
/* предупреждение по слабому сегменту */
.segwarn{margin-top:8px;font-size:12px;color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:10px;padding:6px 9px;line-height:1.35}
/* недели */
.wk{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;align-items:end;height:120px;margin-top:14px}
.wk>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--dim);gap:4px}
.wk .bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:growy .9s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.wk .v{font-size:10px;font-weight:700}
#conf{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ═════════ v29 «Premium»: глубина, типографика, плавающая навигация, a11y ═════════ */
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  --font-d:"Manrope","Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --bg:#070a12;--bg2:#0b101c;--card:#111827;--card2:#1a2438;--line:#26334d;--text:#f1f5fc;
  --muted:#a9b5cd;--dim:#8f9bb5;           /* контраст на --card ≥ 7:1 и ≥ 5:1 (WCAG AA/AAA) */
  --sh1:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px -16px rgba(0,0,0,.7);
  --sh2:0 1px 0 rgba(255,255,255,.08) inset,0 18px 44px -18px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.02);
  --glow:color-mix(in srgb,var(--blue) 45%,transparent);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html[data-theme=light]{--muted:#4b5876;--dim:#65728f;--sh1:0 1px 0 #fff inset,0 10px 28px -16px rgba(30,45,90,.35);--sh2:0 1px 0 #fff inset,0 18px 40px -18px rgba(30,45,90,.45)}
html,body{font-family:var(--font);font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
h1,.hero .p,.tile .v,.score,.eta-big{font-family:var(--font-d)}
h1{font-weight:800;letter-spacing:-.025em;font-size:26px}
.cap{font-weight:700;letter-spacing:.09em;font-size:11.5px}
.num,.hero .p,.tile .v,.bet .o{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11"}
.tile .v{font-weight:800;font-size:24px;letter-spacing:-.02em}
body{padding-bottom:calc(112px + var(--safe-b))}

/* карточки: глубина и «стекло» */
.card,.row,.tile{box-shadow:var(--sh1);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s,background .3s}
.card{border-radius:22px;padding:18px;margin-bottom:14px}
.row{border-radius:20px;padding:15px 16px;margin-bottom:12px}
@media (hover:hover){.row:hover,.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2),0 0 0 1px var(--glow);border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}}
.row:active{transform:scale(.985)}
.row .teams{font-family:var(--font-d);font-weight:700;font-size:16.5px;letter-spacing:-.015em}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--card2) 85%,var(--blue)),var(--card) 70%);box-shadow:var(--sh2);transform-style:preserve-3d;will-change:transform}
.hero.tilting{transition:transform .08s linear}
.hero:not(.tilting){transition:transform .6s var(--ease)}
.hero .sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--sx,50%) var(--sy,0%),rgba(255,255,255,.16),transparent 60%)}
.hero.tilting .sheen{opacity:1}

/* прогресс-бары: свечение + шкала */
.pbar{height:8px;border-radius:6px;background:var(--track)}
.pbar i{box-shadow:0 0 12px -2px currentColor;position:relative;border-radius:2px}
.pbar i:first-child{box-shadow:0 0 14px -2px var(--glow)}

/* чипы, переключатели, кнопки: зона нажатия ≥ 44px */
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-size:13.5px}
.seg button{min-height:44px}
.sort button{min-height:36px;position:relative}
.sort button::after,.iconbtn::after{content:"";position:absolute;inset:-4px}
.iconbtn{width:44px;height:44px;position:relative;box-shadow:var(--sh1);transition:transform .2s var(--ease),border-color .2s}
.iconbtn:active{transform:scale(.9)}
.tools{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto;gap:8px;scrollbar-width:none;margin-left:calc(-1*var(--pad));margin-right:calc(-1*var(--pad));padding:2px var(--pad) 12px;align-items:center}
.tools::-webkit-scrollbar{display:none}.tools>*{flex:none}.tools .sp{flex:1 0 0;min-width:0}
.bet,.btn,.actions button{min-height:44px}
.chip.on,.seg button.on{box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 60%,transparent),0 6px 18px -8px var(--glow)}
button:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.search{min-height:48px;border-radius:16px;font-size:15px}

/* плавающая стеклянная навигация */
.nav{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(10px + var(--safe-b));border-radius:28px;padding:8px;
  border:1px solid color-mix(in srgb,var(--text) 12%,transparent);
  background:color-mix(in srgb,var(--bg2) 66%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 22px 50px -14px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.1) inset,0 0 38px -16px var(--glow);
  max-width:520px;margin:0 auto}
html[data-fx="on"] .nav{background:color-mix(in srgb,var(--bg2) 58%,transparent)}
.nav button{min-height:52px;border-radius:20px;font-size:11.5px;letter-spacing:.01em;padding:7px 4px}
.nav button.on{color:var(--text)}
.nav button.on svg{filter:drop-shadow(0 0 7px var(--blue));stroke:var(--blue)}
.nav .pill{top:8px;bottom:8px;border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 22%,var(--card2)),var(--card2));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent),0 8px 22px -8px var(--glow)}
#toast{bottom:calc(100px + var(--safe-b))}

/* липкая мини-шапка */
#mini{position:fixed;top:0;left:0;right:0;z-index:25;padding:calc(8px + var(--safe-t)) 16px 8px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-d);font-weight:800;font-size:15.5px;letter-spacing:-.01em;
  background:color-mix(in srgb,var(--bg2) 70%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border-bottom:1px solid color-mix(in srgb,var(--text) 9%,transparent);transform:translateY(-110%);opacity:0;transition:transform .35s var(--ease),opacity .25s;pointer-events:none}
#mini.on{transform:none;opacity:1}
#mini i{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}

/* появление карточек при прокрутке */
.rv{opacity:0;transform:translateY(18px) scale(.985)}
.rv.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .7s var(--ease);transition-delay:var(--rd,0ms)}
html[data-fxl="off"] .rv{opacity:1;transform:none}

/* скелетоны: переливание */
.skel{height:112px;border-radius:20px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--card) 90%,transparent) 20%,color-mix(in srgb,var(--card2) 95%,#fff 3%) 50%,color-mix(in srgb,var(--card) 90%,transparent) 80%);background-size:220% 100%;animation:sh 1.4s linear infinite}
.skel::before{content:"";position:absolute;left:16px;top:16px;width:38%;height:11px;border-radius:6px;background:color-mix(in srgb,var(--text) 9%,transparent)}
.skel::after{content:"";position:absolute;left:16px;right:16px;bottom:18px;height:8px;border-radius:5px;background:color-mix(in srgb,var(--text) 9%,transparent)}

/* пустые состояния */
.empty{padding:44px 16px;font-size:15px;animation:emptyin .7s var(--ease) both}
.empty::before{content:"";display:block;width:76px;height:76px;margin:0 auto 14px;border-radius:24px;opacity:.9;
  background:color-mix(in srgb,var(--blue) 12%,transparent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236096ff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='8.5'/><path d='M12 7.5l3.6 2.6-1.4 4.2H9.8L8.4 10.1z'/></svg>") center/46px no-repeat;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 30%,transparent),0 14px 34px -14px var(--glow);animation:float 4s ease-in-out infinite}
@keyframes emptyin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* график */
.chartbox .tip{background:color-mix(in srgb,var(--card2) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--sh2);border-radius:12px;padding:7px 11px;font-weight:700}
.chart .draw{filter:drop-shadow(0 0 6px var(--lc,#9aa7c7))}
@media (max-width:360px){h1{font-size:23px}.tile .v{font-size:21px}.row .teams{font-size:15.5px}}

/* ═════════ v30 «Next-Level»: пружины, шум, bento, шторки, контейнерные запросы ═════════ */
@property --gx{syntax:'<number>';initial-value:0;inherits:true}
@property --gy{syntax:'<number>';initial-value:0;inherits:true}
:root{--spring:cubic-bezier(.34,1.45,.5,1);--spring-d:.7s}
.row,.tile{transition:height .55s var(--ease),opacity .45s,transform var(--spring-d) var(--spring),margin .55s,padding .55s,box-shadow .35s var(--ease),border-color .3s,background .3s}
.card{transition:transform var(--spring-d) var(--spring),box-shadow .35s var(--ease),border-color .3s,background .3s}
.chip,.seg button,.sort button,.actions button,.iconbtn,.nav button{transition:transform .5s var(--spring),background .25s,color .25s,box-shadow .3s,border-color .25s}
.row:active,.card:active{transform:scale(.982)}
.chip:active,.iconbtn:active,.actions button:active{transform:scale(.92)}
.nav .pill{transition:transform var(--spring-d) var(--spring),width .45s var(--spring)}
.view.fwd,.view.bwd{animation-duration:.55s;animation-timing-function:var(--spring)}
/* долгое нажатие */
.lp{transform:scale(1.035)!important;box-shadow:0 0 0 1.5px var(--blue),0 18px 46px -12px var(--glow)!important;z-index:2}

/* матовая плёнка шума */
#noise{position:fixed;inset:-24px;z-index:3;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-position:calc(var(--gx,0)*18px) calc(var(--gy,0)*18px)}
html[data-theme=light] #noise{opacity:.04}
/* параллакс по наклону */
.hero{translate:calc(var(--gx,0)*-6px) calc(var(--gy,0)*-5px)}
.ring{translate:calc(var(--gx,0)*5px) calc(var(--gy,0)*4px)}
/* стекло: «преломление» — градиентная рамка, угол зависит от наклона */
html[data-fxl="max"] .card:not(.empty)::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;opacity:.85;
  background:conic-gradient(from calc(var(--ang) + var(--gx,0)*70deg),transparent 0 58%,color-mix(in srgb,var(--blue) 75%,transparent) 76%,rgba(255,255,255,.42) 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ang 14s linear infinite}
html[data-fxl="max"] .nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 40%)}

/* Bento: главные метрики крупнее */
.kpi .tile:first-child{grid-column:1/-1;display:flex;flex-direction:column;justify-content:center;padding:16px 18px}
.kpi .tile:first-child .v{font-size:clamp(36px,11vw,56px);letter-spacing:-.035em;line-height:1.05}
.today .tiles{grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto}
.today .tiles .tile:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.today .tiles .tile:first-child .v{font-size:clamp(40px,12vw,62px);letter-spacing:-.04em;line-height:1}
/* fluid typography */
h1{font-size:clamp(23px,calc(17px + 2.2vw),34px)}
.row .teams{font-size:clamp(15.5px,calc(13px + .85vw),19px)}
.tile .v{font-size:clamp(20px,calc(15px + 1.6vw),30px)}
.hero .tn{font-size:clamp(15px,calc(12px + .9vw),20px)}
.ring .big{font-size:clamp(28px,8vw,38px)}
.sub{font-size:clamp(12.5px,calc(11px + .45vw),14.5px)}
/* контейнерные запросы: сетка перестраивается по ширине контейнера, а не экрана */
#app{container:app/inline-size}
@container app (min-width:600px){
  #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
  #list>.day,#list>.nowhead,#list>.empty{grid-column:1/-1}
  .kpi{grid-template-columns:repeat(4,1fr)} .kpi .tile:first-child{grid-column:span 2}
  .mk{grid-template-columns:repeat(4,1fr)}
}
@container app (min-width:920px){#list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:700px){.wrap{max-width:min(1080px,100%)}.nav{max-width:560px}}
/* складные устройства: сетка огибает сгиб */
@media (horizontal-viewport-segments:2){
  #list{display:grid!important;grid-template-columns:1fr 1fr;column-gap:calc(env(viewport-segment-left 1 0,50vw) - env(viewport-segment-right 0 0,50vw) + 12px)}
  #list>.day,#list>.nowhead,#list>.empty{grid-column:1/-1}
}

/* потянуть для обновления: «сфера» */
#ptr{width:46px;height:46px;margin-left:-23px;border:0;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85),var(--blue) 42%,color-mix(in srgb,var(--blue) 35%,#000));
  box-shadow:0 0 26px var(--glow),inset 0 -7px 14px rgba(0,0,0,.35);scale:1 var(--sy,1);transition:opacity .25s,transform .45s var(--spring)}
#ptr svg{stroke:#fff;width:20px;height:20px}
#ptr.armed{box-shadow:0 0 38px var(--blue),inset 0 -7px 14px rgba(0,0,0,.35)}
#ptr.spin{animation:orb 1s ease-in-out infinite}
#ptr.spin svg{animation:spin .9s linear infinite}
@keyframes orb{0%,100%{transform:translateY(22px) scale(1)}50%{transform:translateY(30px) scale(1.2)}}

/* плавное перетекание чисел */
.flowup{animation:fup 1.5s ease-out}.flowdn{animation:fdn 1.5s ease-out}
@keyframes fup{0%{text-shadow:0 0 14px #34d399;color:#34d399}100%{text-shadow:0 0 0 transparent}}
@keyframes fdn{0%{text-shadow:0 0 14px #f87171;color:#f87171}100%{text-shadow:0 0 0 transparent}}
#cl,#cc{transition:opacity .25s}
.ring .rseg{cursor:pointer;pointer-events:stroke}
.ringleg span{cursor:pointer;padding:6px 4px;min-height:32px;display:inline-flex;align-items:center;gap:6px}

/* шторка снизу */
#sheetbg{position:fixed;inset:0;z-index:70;background:rgba(2,4,10,.5);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);opacity:0;pointer-events:none;transition:opacity .35s}
#sheetbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:640px;margin:0 auto;max-height:84vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;
  background:color-mix(in srgb,var(--bg2) 82%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid color-mix(in srgb,var(--text) 12%,transparent);border-bottom:0;box-shadow:0 -24px 60px -12px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.1) inset;
  transform:translateY(105%);will-change:transform;padding-bottom:calc(14px + var(--safe-b))}
#sheet .grab{touch-action:none;padding:10px 0 6px;cursor:grab}
#sheet .grab i{display:block;width:44px;height:5px;border-radius:3px;margin:0 auto;background:color-mix(in srgb,var(--text) 28%,transparent)}
#sheet .sh-t{font-family:var(--font-d);font-weight:800;font-size:19px;padding:2px 20px 10px;letter-spacing:-.02em}
#sheet .sh-b{overflow:auto;padding:0 18px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet .chips{margin:0 -18px;padding:2px 18px 10px;flex-wrap:wrap;overflow:visible}
#sheet .sh-l{font-size:12px;letter-spacing:.09em;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
#sheet .go{width:100%;min-height:50px;border-radius:16px;font-weight:700;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 88%,#fff),var(--blue));color:#fff;margin-top:14px;box-shadow:0 12px 30px -10px var(--glow)}
html:not([data-fxl="off"]) #sheet .sh-b>*{animation:shin .55s var(--spring) both;animation-delay:calc(var(--k,0)*45ms)}
@keyframes shin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* офлайн-плашка */
#offline{position:fixed;left:50%;top:calc(10px + max(env(safe-area-inset-top,0px),var(--tg-top,0px)));z-index:80;transform:translate(-50%,-160%);display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13.5px;
  background:color-mix(in srgb,var(--card2) 85%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid color-mix(in srgb,#f87171 55%,transparent);box-shadow:0 14px 36px -10px rgba(248,113,113,.45);transition:transform .7s var(--spring);white-space:nowrap}
#offline.on{transform:translate(-50%,0)}
#offline i{width:9px;height:9px;border-radius:50%;background:#f87171;box-shadow:0 0 12px #f87171;animation:livepulse2 1.4s infinite}
#offline.ok{border-color:color-mix(in srgb,#34d399 55%,transparent);box-shadow:0 14px 36px -10px rgba(52,211,153,.45)}
#offline.ok i{background:#34d399;box-shadow:0 0 12px #34d399;animation:none}
@keyframes livepulse2{50%{opacity:.35;transform:scale(.8)}}

/* View Transitions */
.nav{view-transition-name:vnav}#mini{view-transition-name:vmini}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html[data-vt] .view{animation:none!important}
@keyframes vt-oL{to{opacity:0;transform:translateX(-9%) scale(.97);filter:blur(6px)}}
@keyframes vt-iR{from{opacity:0;transform:translateX(12%) scale(.985)}}
@keyframes vt-oR{to{opacity:0;transform:translateX(9%) scale(.97);filter:blur(6px)}}
@keyframes vt-iL{from{opacity:0;transform:translateX(-12%) scale(.985)}}
@keyframes vt-o{to{opacity:0;transform:scale(.985);filter:blur(4px)}}
@keyframes vt-i{from{opacity:0;transform:scale(1.012)}}
html[data-vt=fwd]::view-transition-old(root){animation:vt-oL .38s var(--ease) both}
html[data-vt=fwd]::view-transition-new(root){animation:vt-iR .55s var(--spring) both}
html[data-vt=bwd]::view-transition-old(root){animation:vt-oR .38s var(--ease) both}
html[data-vt=bwd]::view-transition-new(root){animation:vt-iL .55s var(--spring) both}
html[data-vt=tab]::view-transition-old(root){animation:vt-o .28s var(--ease) both}
html[data-vt=tab]::view-transition-new(root){animation:vt-i .45s var(--spring) both}

  animation:bounce 1.6s cubic-bezier(.3,0,.4,1) infinite}

.empty.t-cup::before{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23fbbf24' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 10h24v16a12 12 0 0 1-24 0z' fill='%23fbbf2433'/><path d='M20 14H10c0 10 4 14 11 15M44 14h10c0 10-4 14-11 15M32 38v10M22 54h20M26 48h12'/></svg>") center/contain no-repeat;animation:float 3.2s ease-in-out infinite}
.empty.t-cup::after{animation:none;opacity:.5}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}8%{transform:translateY(0) scaleY(.9) scaleX(1.06)}50%{transform:translateY(-22px) rotate(180deg)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.45}}

/* ═════════ v31 «God Tier»: WebGL-фон, liquid glass, радар, ачивки, копилот, жесты ═════════ */
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100lvh;z-index:-1;display:none;pointer-events:none}
html[data-gl="on"] #gl{display:block}
html[data-gl="on"] #fx{display:none!important}
html[data-gl="on"] body{background:var(--bg)!important}
.bgpick{grid-template-columns:repeat(3,1fr)!important}.bgpick button{aspect-ratio:1.55!important}
.bgpick .b-fluid{background:radial-gradient(circle at 20% 30%,var(--blue),transparent 55%),radial-gradient(circle at 80% 70%,#c026d3,transparent 55%),radial-gradient(circle at 60% 20%,#22d3ee,transparent 50%),#070816}

/* liquid glass: преломление на кромке, блик, внутреннее свечение */
.nav,#sheet{--glare:-60%;
  box-shadow:0 26px 60px -16px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.22),
   inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),inset 1.5px 0 0 rgba(255,255,255,.18),inset -1.5px 0 0 rgba(255,255,255,.18),
   inset 0 0 26px rgba(255,255,255,.07),0 0 40px -16px var(--glow)}
.nav{-webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.06);backdrop-filter:blur(18px) saturate(200%) brightness(1.06);-webkit-backdrop-filter:url(#lens) blur(14px) saturate(200%) brightness(1.06);backdrop-filter:url(#lens) blur(14px) saturate(200%) brightness(1.06)}
.nav::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;mix-blend-mode:soft-light;opacity:.9;
  background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.55) 46%,rgba(255,255,255,.15) 52%,transparent 66%) var(--glare) 0/220% 100% no-repeat}
.nav::before{background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 45%),radial-gradient(120% 90% at 50% 130%,color-mix(in srgb,var(--blue) 30%,transparent),transparent 60%)!important}
.nav .pill{-webkit-backdrop-filter:url(#lens) blur(6px) saturate(220%) brightness(1.12);backdrop-filter:url(#lens) blur(6px) saturate(220%) brightness(1.12);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05)),color-mix(in srgb,var(--blue) 18%,transparent)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 18px -8px color-mix(in srgb,var(--blue) 40%,transparent),0 0 0 1px rgba(255,255,255,.18),0 8px 24px -8px var(--glow)!important}
#sheet{-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);background:color-mix(in srgb,var(--bg2) 72%,transparent)!important}

/* радар */
.radar{display:block;width:100%;max-width:330px;margin:6px auto 0;overflow:visible}
.radar .gr{fill:none;stroke:color-mix(in srgb,var(--text) 14%,transparent);stroke-width:1}
.radar .ax{stroke:color-mix(in srgb,var(--text) 12%,transparent);stroke-width:1}
.radar .lb{font:600 11px var(--font,system-ui);fill:var(--muted);text-anchor:middle}
.radar .pg{transform-origin:130px 130px;transform:scale(.02);opacity:0;transition:transform 1s var(--spring),opacity .5s;stroke-width:2.2;stroke-linejoin:round}
.radar.in .pg{transform:scale(1);opacity:1}.radar.in .pg.b{transition-delay:.15s}
.radar .pd{opacity:0;transition:opacity .4s .8s}.radar.in .pd{opacity:1}
.rlegend{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:700;margin-top:6px}
.rlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.rvals{width:100%;margin-top:10px;font-size:13px;border-collapse:collapse}.rvals td{padding:5px 2px;border-top:1px solid var(--line)}.rvals td:nth-child(2){text-align:center;color:var(--muted)}.rvals td:last-child{text-align:right}
.hm{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;align-items:center;margin-top:10px;font-size:12px}
.hm .t{grid-column:1/-1;font-weight:700;margin-top:8px;color:var(--text)}
.hm .c{height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);opacity:0;transform:scale(.6);animation:hmin .5s var(--spring) forwards;animation-delay:calc(var(--i)*60ms)}
@keyframes hmin{to{opacity:1;transform:none}}
.hm .l{color:var(--muted);padding-right:4px}

/* копилот */
#fab{position:fixed;right:16px;bottom:calc(104px + var(--safe-b,0px));z-index:30;width:56px;height:56px;border-radius:20px;border:0;display:grid;place-items:center;font-size:24px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),color-mix(in srgb,var(--blue) 40%,#c026d3));box-shadow:0 14px 34px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.5);
  transform:translateY(90px) scale(.5);opacity:0;pointer-events:none;transition:transform .7s var(--spring),opacity .3s}
#fab.on{transform:none;opacity:1;pointer-events:auto}
#fab:active{transform:scale(.9)}
#fab::after{content:"";position:absolute;inset:-6px;border-radius:24px;border:2px solid var(--blue);opacity:0;animation:fabp 2.6s ease-out infinite}
@keyframes fabp{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.cp{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px 2px 8px;scrollbar-width:none}
.cp .bub{max-width:88%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;animation:bubin .5s var(--spring) both}
.cp .bub.ai{background:color-mix(in srgb,var(--card2) 85%,transparent);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.cp .bub.me{background:linear-gradient(135deg,var(--blue),color-mix(in srgb,var(--blue) 50%,#7c3aed));color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.cp .bub p{margin:0 0 6px}.cp .bub p:last-child{margin:0}
.cp .dots{display:inline-flex;gap:4px}.cp .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dt 1s infinite}.cp .dots i:nth-child(2){animation-delay:.15s}.cp .dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes bubin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.cpq{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cpq button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:600 13.5px var(--font,system-ui);cursor:pointer}
.cpq button:active{transform:scale(.94)}
.cpn{font-size:11.5px;color:var(--dim);margin-top:8px}

/* ачивки */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ach .bd{border-radius:18px;padding:12px 6px 10px;text-align:center;border:1px solid var(--line);background:color-mix(in srgb,var(--card2) 70%,transparent);position:relative;overflow:hidden}
.ach .bd .ic{font-size:30px;filter:grayscale(1) opacity(.35);transition:filter .4s}
.ach .bd.on .ic{filter:none;animation:pop .8s var(--spring)}
.ach .bd.on{border-color:color-mix(in srgb,var(--blue) 50%,var(--line));box-shadow:0 10px 26px -14px var(--glow)}
.ach .bd .tt{font-size:12px;font-weight:700;margin-top:6px;line-height:1.2}.ach .bd .dd{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.25}
.ach .bd .pr{height:4px;border-radius:3px;background:var(--track,rgba(255,255,255,.08));margin-top:7px;overflow:hidden}.ach .bd .pr i{display:block;height:100%;background:var(--blue);border-radius:3px}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:none}}
#achT{position:fixed;left:50%;top:calc(12px + max(env(safe-area-inset-top,0px),var(--tg-top,0px)));z-index:90;transform:translate(-50%,-140%);display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:24px;
  background:color-mix(in srgb,var(--bg2) 70%,transparent);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:1px solid color-mix(in srgb,var(--blue) 55%,transparent);box-shadow:0 20px 50px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .8s var(--spring);max-width:92vw}
#achT.on{transform:translate(-50%,0)}
#achT .ic{font-size:34px;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--blue) 22%,transparent)}
#achT.on .ic{animation:pop .9s var(--spring)}
#achT b{display:block;font:800 15px var(--font-d,system-ui)}#achT span{font-size:12.5px;color:var(--muted)}
.vbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:20px}
.vbtn.rec{color:#f87171;animation:fabp2 1s infinite}@keyframes fabp2{50%{transform:translateY(-50%) scale(1.18)}}
.qwrap{position:relative}.qwrap .search{padding-right:54px}
.swh{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:26px;pointer-events:none;opacity:0;transition:opacity .15s}
.row{touch-action:pan-y;position:relative}
.row.sw{transition:none!important;z-index:2}
.row.swb{transition:transform .5s var(--spring)!important}
#undo{position:fixed;left:50%;bottom:calc(104px + var(--safe-b,0px));transform:translate(-50%,calc(100% + 160px));z-index:70;display:flex;align-items:center;gap:14px;padding:6px 8px 6px 18px;border-radius:22px;background:color-mix(in srgb,var(--card2) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--sh2);font-size:14px;transition:transform .6s var(--spring)}
#undo.on{transform:translate(-50%,0)}#undo button{min-height:44px;padding:0 14px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.stars{border-radius:18px;padding:14px;border:1px solid color-mix(in srgb,#f5b301 45%,var(--line));background:linear-gradient(135deg,rgba(245,179,1,.12),rgba(245,179,1,.02));margin-top:10px}
.stars .pl{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-weight:700}.stars .pl:first-of-type{border-top:0}
.demo{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:8px;background:rgba(245,179,1,.18);color:#f5b301}
.shimg{width:100%;max-height:56vh;object-fit:contain;border-radius:18px;box-shadow:var(--sh2)}
@media (prefers-reduced-motion:reduce){#fab::after,.ach .bd.on .ic,#achT.on .ic{animation:none}}

/* v31b: производительность — убираем дорогие размытия поверх анимированного фона */
.nav{-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}
.nav .pill{-webkit-backdrop-filter:none;backdrop-filter:none}
#sheet{-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
#sheetbg{-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-gl="on"] .card,html[data-gl="on"] .tile,html[data-gl="on"] .row{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-perf="low"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-perf="low"] .nav{background:color-mix(in srgb,var(--bg2) 94%,transparent)!important}
html[data-perf="low"] #sheet{background:color-mix(in srgb,var(--bg2) 96%,transparent)!important}
html[data-perf="low"] .nav::after{display:none}

/* ───────── v32: AI-копилот (стриминг, провайдеры, скелетон, свайпы) ───────── */
@property --ai{syntax:"<color>";inherits:true;initial-value:#6096ff}
:root{--ai:#6096ff;transition:--ai .7s ease}
#conf{z-index:80!important}
.cphd{display:flex;align-items:center;gap:9px;margin:0 2px 10px;font:600 12.5px var(--font,system-ui);color:var(--muted)}
.cphd .pdot{position:relative;width:11px;height:11px;border-radius:50%;background:var(--ai);box-shadow:0 0 12px var(--ai);transition:background .6s,box-shadow .6s}
.cphd .pdot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--ai);opacity:0;animation:pring 2.4s ease-out infinite}
.cphd.idle .pdot::after{animation:none}
@keyframes pring{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.cphd b{color:var(--text);font-weight:700}.cphd .cch{margin-left:auto;font-size:11.5px;opacity:.85}
.cp .brow{position:relative;display:flex;max-width:100%;align-self:flex-start;width:100%}
.cp .brow.me{justify-content:flex-end}
.cp .brow .hint{position:absolute;top:50%;transform:translateY(-50%);font:700 12px var(--font,system-ui);color:var(--ai);opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.cp .brow .hint.l{right:6px}.cp .brow .hint.r{left:6px}
.cp .brow[data-sw="copy"] .hint.l,.cp .brow[data-sw="regen"] .hint.r{opacity:1}
.cp .bub.ai{touch-action:pan-y;position:relative;transition:transform .45s var(--spring),border-color .6s,box-shadow .6s;border-left:2.5px solid var(--ai);box-shadow:-8px 0 22px -14px var(--ai)}
.cp .bub.ai.drag{transition:none}
.cp .bub .ans{white-space:normal;word-break:break-word}
.cp .bub .ans.typing::after{content:"▍";color:var(--ai);margin-left:1px;animation:caret .8s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.cp .bub .meta{margin-top:7px;font:600 11px var(--font,system-ui);color:var(--dim);display:flex;gap:6px;align-items:center}
.cp .errs{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.cp .errs li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:rgba(255,90,90,.09);border:1px solid rgba(255,90,90,.22);font-size:12.5px;line-height:1.35}
.cp .errs li[data-k="rate"],.cp .errs li[data-k="timeout"],.cp .errs li[data-k="server"]{background:rgba(255,190,60,.10);border-color:rgba(255,190,60,.28)}
.cp .errs li i{font-style:normal;opacity:.7;font-size:11px;padding:0 6px;border-radius:8px;background:rgba(127,127,127,.18)}
.cp .errh{font-size:11.5px;opacity:.7;margin:2px 0 8px}.cp .errh code{font-size:11px}
.cp .aisk{width:min(260px,70vw)}
.cp .aisk i{display:block;height:11px;border-radius:6px;margin:9px 0;background:linear-gradient(90deg,rgba(255,255,255,.05),color-mix(in srgb,var(--ai) 38%,rgba(255,255,255,.2)),rgba(255,255,255,.05));background-size:240% 100%;animation:skp 1.25s ease-in-out infinite}
.cp .aisk i:nth-child(1){width:94%}.cp .aisk i:nth-child(2){width:78%;animation-delay:.12s}.cp .aisk i:nth-child(3){width:52%;animation-delay:.24s}

  --spring:var(--e-out);--spring-real:var(--e-out);--spring-d:.62s;
  --sh1:0 1px 0 rgba(255,255,255,.07) inset,0 1px 1px rgba(0,0,0,.30),0 4px 10px -3px rgba(0,0,0,.28),0 16px 30px -12px rgba(0,0,0,.46),0 36px 64px -30px rgba(0,0,0,.62);
  --sh2:0 1px 0 rgba(255,255,255,.10) inset,0 2px 2px rgba(0,0,0,.30),0 8px 16px -4px rgba(0,0,0,.34),0 26px 48px -16px rgba(0,0,0,.55),0 54px 90px -38px rgba(0,0,0,.7);
}
html[data-theme=light]{
  --sh1:0 1px 0 #fff inset,0 1px 1px rgba(30,45,90,.10),0 4px 10px -3px rgba(30,45,90,.12),0 16px 30px -14px rgba(30,45,90,.28),0 34px 60px -32px rgba(30,45,90,.3);
  --sh2:0 1px 0 #fff inset,0 2px 2px rgba(30,45,90,.10),0 8px 16px -4px rgba(30,45,90,.16),0 26px 48px -18px rgba(30,45,90,.34),0 52px 88px -40px rgba(30,45,90,.36);
}
body{letter-spacing:-.006em;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
html{scroll-behavior:auto;--stk40:calc(env(safe-area-inset-top,0px) + 46px)}

/* ── типографика: цифры доминируют, подписи тише и разрежены ── */
.cap{letter-spacing:.11em;font-size:11px;font-weight:700;opacity:.86}
.tile .v,.hero .p,.bet .o,.kpi .tile .v,.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum","cv11"}
.tile .v,.hero .p{letter-spacing:-.04em;font-weight:800;line-height:1.02}
.hero .p{text-shadow:0 0 28px color-mix(in srgb,var(--blue) 38%,transparent)}
h1{letter-spacing:-.03em}
.m38sc b,.m39sc b{letter-spacing:-.04em;font-variant-numeric:tabular-nums}

/* ── глубина: экран «выныривает» из глубины, старый уходит назад и темнеет ── */
@keyframes d40in{from{opacity:0;transform:translate3d(0,18px,0) scale(.962)}to{opacity:1;transform:none}}
@keyframes d40inb{from{opacity:0;transform:translate3d(0,-10px,0) scale(1.03)}to{opacity:1;transform:none}}
@keyframes d40out{to{opacity:0;transform:translate3d(0,0,0) scale(.94)}}
@keyframes d40outb{to{opacity:0;transform:translate3d(0,14px,0) scale(1.04)}}
.view.fwd{animation:d40in .62s var(--e-out) both}
.view.bwd{animation:d40inb .58s var(--e-out) both}
html[data-vt=fwd]::view-transition-old(root){animation:d40out .42s var(--e-io) both;transform-origin:50% 40%}
html[data-vt=fwd]::view-transition-new(root){animation:d40in .64s var(--e-out) both;transform-origin:50% 40%}
html[data-vt=bwd]::view-transition-old(root){animation:d40outb .4s var(--e-io) both;transform-origin:50% 40%}
html[data-vt=bwd]::view-transition-new(root){animation:d40inb .6s var(--e-out) both;transform-origin:50% 40%}
html[data-vt=tab]::view-transition-new(root){animation-timing-function:var(--e-out)}
::view-transition-group(m39){animation-duration:.62s;animation-timing-function:var(--e-out)}
.nav .pill{transition:transform .6s var(--e-out),width .5s var(--e-out)}

/* ── модалки: фон уходит в глубокий blur, панель всплывает из глубины ── */
.m38bg,.m39bg{background:radial-gradient(120% 90% at 50% 100%,rgba(10,16,38,.46),rgba(3,5,12,.74));
  -webkit-backdrop-filter:blur(22px) saturate(130%);backdrop-filter:blur(22px) saturate(130%);transition:opacity .55s var(--e-soft)}
html[data-fxl="off"] .m38bg,html[data-fxl="off"] .m39bg,html[data-perf=low] .m38bg,html[data-perf=low] .m39bg{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(3,5,12,.82)}
.m38p,.m39p{transform:translate3d(0,7vh,0) scale(.94);transform-origin:50% 100%;opacity:0;
  transition:transform .64s var(--e-out),opacity .34s var(--e-soft);box-shadow:var(--sh2),0 -1px 0 rgba(255,255,255,.1) inset}
#m38.on .m38p,#m39.on .m39p{transform:none;opacity:1}
#m38:not(.on) .m38p,#m39:not(.on) .m39p{transition-duration:.36s,.26s;transition-timing-function:var(--e-io)}
#m38,#m39{transition:visibility 0s linear .4s}#m38.on,#m39.on{transition-delay:0s}
#m39.vt .m39p{transition:none}
@media (min-width:640px){.m38p,.m39p{transform-origin:50% 60%}}

/* ── тактильность: мгновенный отклик на касание ── */
.prs40{transform:scale(.965)!important;filter:brightness(1.14);transition:transform .11s var(--e-out)!important}
.row.prs40,.card.prs40,.tile.prs40{transform:scale(.987)!important}
.nav button.prs40{transform:scale(.92)!important}

/* ── табы: перетекающий индикатор, он же следует за пальцем ── */
.ind39{transition:transform .6s var(--e-out),width .5s var(--e-out)}

.tb39{position:sticky;top:var(--stk40);z-index:30;contain:layout paint;
  box-shadow:var(--sh1);transition:transform .4s var(--e-out),box-shadow .4s}
.tb39.stuck40{transform:translate3d(0,0,0) scale(.975);box-shadow:var(--sh2)}
.tb39 button{min-height:44px;letter-spacing:.01em}
.rdx{width:44px;height:44px}


/* ── липкие заголовки дней: при залипании уменьшаются и становятся стеклянной «таблеткой» ── */
.day.cap{position:sticky;top:var(--stk40);z-index:12;display:flex;align-items:center;gap:8px;width:fit-content;
  padding:7px 14px 7px 12px;margin:14px 0 8px;border-radius:99px;transform-origin:0 50%;
  border:1px solid transparent;background:transparent;transition:transform .45s var(--e-out),opacity .45s,box-shadow .45s,background-color .45s,border-color .45s}
.day.cap.stuck40{transform:scale(.92);background:color-mix(in srgb,var(--card2) 70%,transparent);border-color:var(--line);box-shadow:var(--sh1);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
html[data-fxl="off"] .day.cap.stuck40,html[data-perf=low] .day.cap.stuck40{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card2)}

/* ── живое стекло: блик, который «стекает» за пальцем / наклоном телефона ── */
.spec40{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3;contain:strict}
.spec40 b{position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;margin:-60% 0 0 -60%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.15),rgba(255,255,255,.045) 45%,transparent 72%);opacity:.0;transform:translate3d(0,0,0);transition:opacity .6s var(--e-soft)}
.spec40.on b{opacity:.85}
.m38p>.spec40,.m39p>.spec40{height:110px;bottom:auto;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
html[data-theme=light] .spec40 b{background:radial-gradient(closest-side,rgba(255,255,255,.7),rgba(255,255,255,.2) 45%,transparent 72%)}
html[data-fxl="off"] .spec40,html[data-perf=low] .spec40{display:none}
.m38p,.m39p{position:relative}

/* ── область нажатия ≥44px: невидимый дочерний элемент, псевдоэлементы кнопок (кружок тумблера и т.п.) не трогаем ── */
:where(.hit40){position:relative}
.hit40>.h44{position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%);pointer-events:auto;background:none;border:0;padding:0;margin:0}

/* ── уважение к настройкам доступности и режиму без анимаций ── */
html[data-anim=off] .view.fwd,html[data-anim=off] .view.bwd{animation:none}
html[data-anim=off] .m38p,html[data-anim=off] .m39p,html[data-anim=off] .m38bg,html[data-anim=off] .m39bg,html[data-anim=off] .ind39,html[data-anim=off] .day.cap,html[data-anim=off] .tb39{transition:none}
html[data-anim=off] .prs40{transition:none!important}
@media (prefers-reduced-motion:reduce){.view.fwd,.view.bwd{animation:none}.m38p,.m39p,.m38bg,.m39bg,.ind39,.day.cap,.tb39{transition:none}.prs40{transition:none!important}.spec40{display:none}}
.tb39{background:color-mix(in srgb,var(--card2) 95%,transparent);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
html[data-fxl="off"] .tb39,html[data-perf=low] .tb39{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}

/* ═════ v40.1 · полноэкранная аналитика, тумблеры, тост ═════ */
/* ── тумблеры: фиксированная геометрия, кружок двигается только transform ── */
.sw35{width:50px;height:30px;border-radius:15px;overflow:hidden;flex:none;position:relative;box-sizing:border-box}
.sw35::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-sizing:border-box;
  box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .38s var(--e-out)}
.sw35[aria-checked="true"]::after{transform:translateX(20px)}
html[data-anim=off] .sw35::after{transition:none}

/* ── тост: выше нижнего меню, не ловит касания, плавно гаснет ── */
#toast{bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:95;pointer-events:none;max-width:88vw}

/* ═════ v40.2 · карточка матча → полноэкранный экран с верхними вкладками ═════ */
#mv40{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;contain:layout paint;
  background:radial-gradient(120% 46% at 50% -10%,color-mix(in srgb,var(--blue) 15%,transparent),transparent 62%),var(--bg)}
#mv40.on{visibility:visible;pointer-events:auto}
html.mv40on .nav,html.mv40on #fab,html.mv40on #mini{visibility:hidden}

/* шапка: «Назад» + название + панель вкладок, одно стеклянное целое */
.mhd40{flex:none;position:relative;z-index:3;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border-bottom:1px solid var(--line);box-shadow:0 12px 30px -16px rgba(0,0,0,.55)}
html[data-fxl="off"] .mhd40,html[data-perf=low] .mhd40{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
.mh40{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:8px 14px 2px;max-width:760px;margin:0 auto}
.mb40{justify-self:start;display:flex;align-items:center;gap:2px;height:44px;padding:0 16px 0 8px;border-radius:22px;font:700 15px var(--font,system-ui);letter-spacing:-.01em;
  color:var(--text);background:color-mix(in srgb,var(--card2) 88%,transparent);border:1px solid var(--line);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .3s var(--e-out)}
.mb40:active{transform:scale(.95)}
.mb40 svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mb40:focus-visible,.mtb40 button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mt40{min-width:0;text-align:left}
.mt40 b{display:block;font:800 15.5px/1.2 var(--font-d,var(--font,system-ui));letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt40 small{display:block;margin-top:2px;font:700 10.5px var(--font,system-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mtb40{position:relative;display:flex;gap:2px;margin:8px auto 10px;padding:3px;width:calc(100% - 24px);max-width:736px;box-sizing:border-box;border-radius:20px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;
  background:color-mix(in srgb,var(--card2) 72%,transparent);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 10px 20px -14px rgba(0,0,0,.6)}
.mtb40::-webkit-scrollbar{display:none}
.mtb40 button{position:relative;z-index:1;flex:1 0 auto;min-width:62px;height:44px;padding:0 14px;border-radius:17px;white-space:nowrap;
  font:700 14px var(--font,system-ui);letter-spacing:-.01em;color:var(--muted);transition:color .35s var(--e-soft),transform .3s var(--e-out)}
.mtb40 button[hidden]{display:none}
.mtb40 button:active{transform:scale(.95)}
.mtb40 button[aria-selected="true"]{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.28)}
.mtb40 button.off{opacity:.38}
.mi40{position:absolute;z-index:0;left:0;top:3px;bottom:3px;width:0;border-radius:17px;pointer-events:none;
  background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 92%,#fff),color-mix(in srgb,var(--violet) 78%,var(--blue)));
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--blue) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -8px 14px -8px rgba(0,0,0,.28);
  transition:transform .55s var(--e-out),width .55s var(--e-out)}
.mi40::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}

/* контент */
.mvs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;container:app/inline-size;
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.mvs>.view{max-width:760px;margin:0 auto;padding:0 var(--pad,16px);box-sizing:border-box}
#mv40 .view[data-t40="ov"]>.tabs39{display:none}
#mv40 .view:not([data-t40="ov"])>:not(.tabs39):not(.an41):not(.dx41){display:none}
#mv40 .view:not([data-t40="ov"])>.tabs39{margin:12px 0 0}
#mv40 .tabs39>.tb39,#mv40 .tabs39>.ind39{display:none}
#mv40 .rdx{display:none}
#mv40 .rdw svg{max-width:min(100%,620px);margin:0 auto;display:block}

/* ── View Transitions: карточка «раскрывается» в экран и сворачивается обратно ── */
html[data-vt^="mc"]::view-transition{background:var(--bg)}
html[data-vt^="mc"]::view-transition-group(mcard){animation-duration:.58s;animation-timing-function:var(--e-out);z-index:50}
html[data-vt^="mc"]::view-transition-image-pair(mcard){overflow:clip;animation:mcr40 .58s var(--e-out) both}
html[data-vt="mcc"]::view-transition-image-pair(mcard){animation-name:mcr40r}
@keyframes mcr40{from{border-radius:22px}to{border-radius:0}}
@keyframes mcr40r{from{border-radius:0}to{border-radius:22px}}
html[data-vt^="mc"]::view-transition-old(mcard),html[data-vt^="mc"]::view-transition-new(mcard){width:100%;height:100%;object-fit:cover;mix-blend-mode:normal}
html[data-vt^="mc"]::view-transition-old(mcard){object-position:center;animation:none}
html[data-vt^="mc"]::view-transition-new(mcard){object-position:top center;animation:mcfi40 .34s .04s ease-out both}
html[data-vt="mcc"]::view-transition-new(mcard){animation-delay:.2s}
@keyframes mcfi40{from{opacity:0}to{opacity:1}}
@keyframes mcbgo40{to{opacity:.0;transform:scale(.94)}}
@keyframes mcbgi40{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
html[data-vt="mco"]::view-transition-old(root){animation:mcbgo40 .5s var(--e-io) both}
html[data-vt="mco"]::view-transition-new(root){animation:none;opacity:0}
html[data-vt="mcc"]::view-transition-old(root){animation:none;opacity:0}
html[data-vt="mcc"]::view-transition-new(root){animation:mcbgi40 .62s var(--e-out) both}

html[data-anim=off] #mv40 *,html[data-anim=off] .mi40{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#mv40 .mi40,#mv40 .mtb40 button,.mb40{transition:none}}

/* ═════ v40.3 · названия команд: без разреженного трекинга, одна строка, по центру ═════ */
.hero .vs{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);justify-items:center}
.hero .vs>div{min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero .vs>.at{width:auto;margin-top:15px}
.hero .tn,.hero .tn.lg{display:flex;align-items:center;justify-content:center;gap:2px;max-width:100%;min-width:0;white-space:nowrap;overflow-wrap:normal;word-break:normal;
  letter-spacing:-.02em;word-spacing:0;font-size:clamp(15px,calc(12px + .9vw),19px)}
.hero .tnm{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fit,1em)}
.hero .tn .star{flex:none}
.hero .xg{text-align:center;white-space:nowrap}
.hero .mono{margin:0 auto 10px}
/* шапка экрана матча: по центру, свой размер под ширину, а если совсем не влезает — плавное затухание */
.mh40{grid-template-columns:auto minmax(0,1fr)}
.mt40{text-align:center}
.mt40 b{letter-spacing:-.02em;word-spacing:0;font-size:var(--fit,15.5px);text-overflow:clip}
.mt40 b.ovf40,.mt40 small.ovf40{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);text-align:left}
.mt40 small{text-overflow:clip}
/* звезда «избранное» — бейджем на углу логотипа, не отнимает ширину у названия */
.hero .vs>div{position:relative}
.hero .tn .star{position:absolute;top:-6px;left:calc(50% + 14px);width:28px;height:28px;margin:0;display:grid;place-items:center;border-radius:50%;
  background:color-mix(in srgb,var(--card2) 88%,transparent);border:1px solid var(--line);box-shadow:var(--sh1)}
.hero .tn .star svg{width:16px;height:16px}
.hero .tn .star{top:-10px!important;left:calc(50% + 26px)!important;width:26px!important;height:26px!important;min-width:0!important;min-height:0!important;padding:0!important}
.hero .tn .star svg{width:15px!important;height:15px!important}
.hero .tn{height:22px;line-height:22px}
.hero .tnm{line-height:22px}

/* ═════ v41 · логотипы, индекс уверенности, вкладка «Анализ», блоки ДНК ═════ */
/* Логотип команды: подложка с буквами всегда на месте (верстка не прыгает), картинка ложится сверху с object-fit:contain */
.cr41{--s:24px;position:relative;flex:none;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;vertical-align:middle;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c,#44506b) 72%,#0b1020),color-mix(in srgb,var(--c,#44506b) 30%,#0b1020));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 4px 10px -4px rgba(0,0,0,.6);overflow:hidden}
.cr41 b{font:800 calc(var(--s)*.36)/1 var(--font-d,system-ui);letter-spacing:-.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.cr41 img{position:absolute;inset:7%;width:86%;height:86%;object-fit:contain;display:block}
.cr41.ok{background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.cr41.ok b{opacity:0}
.tm41{display:flex;align-items:center;gap:9px;min-width:0}
.tm41>i{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm41.sm{gap:7px}
.teams .tm41+.tm41{margin-top:6px}
.teams span.tm41{display:flex}
td .tm41{display:inline-flex;max-width:100%}
.frow .tm41{flex:1 1 auto;min-width:0}
.lv-teams .tm41{min-width:0}.lv-teams span:last-child.tm41{justify-content:flex-end}
.h2m-sc .tm41{min-width:0}
.tpm .cr41,.gl39 .m .cr41{--s:16px;margin:0 5px 0 0}
.gl39 .m .cr41:last-of-type{margin-left:2px}
.hero .mono.mono41{border:0;background:none;width:auto;height:auto;font-size:0;display:grid;place-items:center;margin:0 auto 10px}
.hero .mono41 .cr41{--s:60px;box-shadow:inset 0 0 0 2px currentColor,0 10px 24px -10px currentColor}
.hero .mono41 .cr41.ok{box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 12px 26px -12px rgba(0,0,0,.8)}

/* AI Conviction Score — bento-плашка над статистикой */
.cv41{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;align-items:center;margin:0 0 14px;padding:16px 18px;border-radius:22px;cursor:pointer;
  background:linear-gradient(160deg,color-mix(in srgb,var(--card2) 92%,transparent),var(--card));border:1px solid var(--line);box-shadow:var(--sh2);overflow:hidden;text-align:left;width:100%;color:var(--text)}
.cv41::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--tone,var(--blue)) 20%,transparent),transparent 60%);pointer-events:none}
.cv41>*{position:relative}
.cv41 .sc{display:flex;align-items:baseline;gap:3px;font-family:var(--font-d,system-ui);font-variant-numeric:tabular-nums lining-nums}

.chip41{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font:700 11px var(--font,system-ui);letter-spacing:.01em;white-space:nowrap;
  background:color-mix(in srgb,var(--cc,var(--muted)) 14%,transparent);color:var(--cc,var(--muted));border:1px solid color-mix(in srgb,var(--cc,var(--muted)) 32%,transparent)}
.chip41.red{--cc:var(--red)}.chip41.grn{--cc:var(--green)}.chip41.amb{--cc:var(--amber)}.chip41.blu{--cc:var(--blue)}

/* Блоки анализа и ДНК */
