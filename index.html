</nav>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#090d16"); tg.setBackgroundColor && tg.setBackgroundColor("#090d16");
  tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const $app = document.getElementById("app");
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

const LEAGUES = {EPL:"АПЛ",La_Liga:"Ла Лига",Bundesliga:"Бундеслига",Serie_A:"Серия A",Ligue_1:"Лига 1",RFPL:"РПЛ",Champions_League:"Лига чемпионов",
  Europa_League:"Лига Европы",Conference_League:"Лига конференций",Eredivisie:"Эредивизи",Portugal:"Португалия",Turkey:"Турция",Belgium:"Бельгия"};
const LCOL = {EPL:"#a770ff",La_Liga:"#ff9646",Bundesliga:"#f05a5a",Serie_A:"#5aa0ff",Ligue_1:"#50cdeb",RFPL:"#eb5564",Champions_League:"#5082ff",
  Europa_League:"#ff8c3c",Conference_League:"#46c882",Eredivisie:"#ff783c",Portugal:"#3cbe78",Turkey:"#f04650",Belgium:"#fac83c"};
const MARKETS = [["TB_2.5","Тотал 2.5",["Больше","Меньше"]],["BTTS","Обе забьют",["Да","Нет"]],["CORN_9.5","Угловые 9.5",["Больше","Меньше"]],["CARD_3.5","Карточки 3.5",["Больше","Меньше"]]];
const state = {tab:"matches", league:"", days:4, q:"", detail:null, betsTab:"open", sort:"time", favOnly:false, recOnly:false, showDone:false, cache:{}, favs:[], scroll:0, lang:"ru", today:null};

/* ─────────── утилиты ─────────── */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const pc = (x,d=0)=>x==null?"—":(x*100).toFixed(d)+"%";
const sgn = (x,d=1)=>x==null?"—":(x>=0?"+":"")+(x*100).toFixed(d)+"%";
const mon = x=>x==null?"—":(x<0?"−":"")+Math.abs(Math.round(x)).toLocaleString("ru-RU")+" ₽";
const fair = p=>p>0?(1/p).toFixed(2):"—";
/* число, которое «набегает» от нуля (в разметке сразу итоговое значение — без JS/при сбое оно тоже верное) */
const cnt = (v,d=0,suf="",sign=false)=>`<span class="num" data-count="${v}" data-dec="${d}" data-suf="${suf}"${sign?' data-sign="1"':""}>${(sign&&v>=0?"+":"")+Number(v).toFixed(d)+suf}</span>`;
const cntp = (x,d=0)=>x==null?"—":cnt(x*100,d,"%");
function haptic(kind){try{if(!tg||!tg.HapticFeedback) return; kind==="ok"?tg.HapticFeedback.notificationOccurred("success"):tg.HapticFeedback.selectionChanged();}catch(e){}}
function toast(t){const el=document.getElementById("toast"); el.textContent=t; el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1800);}
const nextFrame = f=>requestAnimationFrame(()=>requestAnimationFrame(f));

function countUp(root){
  (root||document).querySelectorAll("[data-count]").forEach(el=>{
    const to=parseFloat(el.dataset.count), d=+el.dataset.dec||0, suf=el.dataset.suf||"", sign=el.dataset.sign==="1";
    const fmt=v=>(sign&&v>=0?"+":"")+v.toFixed(d)+suf;
    if(RM||document.documentElement.dataset.anim==="off"||!isFinite(to)){ el.textContent=fmt(to); return; }
    const t0=performance.now(), dur=800; el.textContent=fmt(0);
    (function f(t){const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(to*e); if(k<1) requestAnimationFrame(f); else el.textContent=fmt(to);})(t0);
  });
}
function stagger(root,sel){ [...(root.querySelectorAll(sel)||[])].forEach((c,i)=>c.style.setProperty("--i",Math.min(i,10))); }
/* показать вид: плавное появление, каскад карточек, набегающие числа */
function mount(html, kind){
  $app.innerHTML = `<div class="view ${kind||(state.dir==="bwd"?"bwd":state.dir==="fwd"?"fwd":"")}">${snapNote()}${html}</div>`; state.dir=null;
  const v = $app.firstElementChild; [...v.children].forEach((c,i)=>c.style.setProperty("--i",Math.min(i,10)));
  countUp(v); return v;
}

/* ─────────── хранилище избранного (Telegram CloudStorage → localStorage) ─────────── */
const store = {
  cloud(){ try{ return !!(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")); }catch(e){ return false; } },
  ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  get(k){ return new Promise(res=>{ const l=this.ls(k); if(!this.cloud()) return res(l);
    let done=false; const t=setTimeout(()=>{ if(!done){done=true;res(l);} },1500);
    try{ tg.CloudStorage.getItem(k,(err,v)=>{ if(done) return; done=true; clearTimeout(t); res(!err&&v?v:l); }); }catch(e){ res(l); } }); },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} try{ if(this.cloud()) tg.CloudStorage.setItem(k,v,()=>{}); }catch(e){} }
};
async function loadFavs(){ try{ const v=JSON.parse(await store.get("favs")||"[]"); state.favs=Array.isArray(v)?v.filter(x=>typeof x==="string").slice(0,60):[]; }catch(e){ state.favs=[]; } }
const isFav = n=>state.favs.includes(n);
/* язык названий команд: только показ; ключи (избранное, поиск, запросы) остаются английскими */
async function loadLang(){ try{ const v=await store.get("lang"); state.lang=(v==="en")?"en":"ru"; }catch(e){ state.lang="ru"; } }
const nm = (en,ru)=> (state.lang==="ru" && ru) ? ru : en;
const nmH = o=>nm(o.home,o.home_ru), nmA = o=>nm(o.away,o.away_ru);
const lbl = b=> state.lang==="ru" ? (b.label_ru||b.label) : b.label;
function toggleLang(){ state.lang = state.lang==="ru"?"en":"ru"; store.set("lang",state.lang); haptic(); }
function toggleFav(n){ const i=state.favs.indexOf(n); if(i>=0) state.favs.splice(i,1); else state.favs.push(n); store.set("favs",JSON.stringify(state.favs.slice(0,60))); haptic(); return i<0; }

/* ─────────── сеть ─────────── */
/* ─── режим «без туннеля»: страница лежит на GitHub Pages рядом с зашифрованным снимком (publish_snapshot.py) ─── */
const STATIC = !!document.querySelector('meta[name="fb-static"]');
let SNAP=null, SNAP_AT=0, SNAP_P=null, _keyCache=null, SNAP_STALE=false;
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };
/* тема: авто (как в Telegram) / светлая / тёмная; выбор хранится локально */
function applyTheme(){
  const pref = lsGet("theme") || "auto";
  const sys = (tg && tg.colorScheme) || ((window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark");
  const th = pref==="auto" ? sys : pref;
  document.documentElement.dataset.theme = th;
  const c = th==="light" ? "#f3f5fa" : "#090d16";
  try { tg && tg.setHeaderColor && tg.setHeaderColor(c); tg && tg.setBackgroundColor && tg.setBackgroundColor(c); } catch(e){}
}
applyTheme();
try { tg && tg.onEvent && tg.onEvent("themeChanged", applyTheme); } catch(e){}
const normKey = p=>String(p||"").replace(/[\s\-]/g,"").toUpperCase();
const unb64 = s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptEnv(env, pass){
  if(!(window.crypto&&crypto.subtle)){ const e=new Error("nocrypto"); e.code="nocrypto"; throw e; }
  const enc=new TextEncoder(), salt=unb64(env.salt), iv=unb64(env.iv), ct=unb64(env.ct);
  const km=await crypto.subtle.importKey("raw", enc.encode(normKey(pass)), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:env.iter,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  let buf=await crypto.subtle.decrypt({name:"AES-GCM",iv,additionalData:enc.encode("fbapp1")}, key, ct);   // неверный ключ → исключение
  if(env.z){
    if(typeof DecompressionStream==="undefined"){ const e=new Error("nozip"); e.code="nozip"; throw e; }
    buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
  }
  return JSON.parse(new TextDecoder().decode(buf));
}
function askKey(msg){
  return new Promise(res=>{
    mount(`<div class="card" style="margin-top:28px"><div class="cap">Ключ доступа</div>
      <div class="muted" style="margin:6px 0 12px">Данные приложения зашифрованы. Введите ключ один раз — он запомнится на этом телефоне.<br>Ключ покажет бот по команде <b>/appkey</b>.</div>
      <input class="search" id="keyin" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      ${msg?`<div class="sub" style="color:var(--red);margin:8px 0">${esc(msg)}</div>`:""}
      <button class="btn" id="keyok" style="margin-top:10px">Открыть</button></div>`);
    const go=()=>{ const v=document.getElementById("keyin").value; if(normKey(v).length>=12) res(v); };
    document.getElementById("keyok").onclick=go;
    document.getElementById("keyin").onkeydown=e=>{ if(e.key==="Enter") go(); };
  });
}
function ensureSnap(maxAge=45000){
  if(SNAP && Date.now()-SNAP_AT<maxAge) return Promise.resolve(SNAP);
  if(SNAP_P) return SNAP_P;
  SNAP_P=(async()=>{
    try{
      let env;
      try{
        const r=await fetch("snapshot.enc.json?t="+Date.now(),{cache:"no-store"});
        if(!r.ok){ const e=new Error("http "+r.status); e.code=r.status===404?"nosnap":r.status; throw e; }
        env=await r.json(); SNAP_STALE=false;
        try{ localStorage.setItem("snapenv",JSON.stringify(env)); }catch(e){}            /* v34: копия для работы без сети */
      }catch(e){ if(SNAP) return SNAP; let c=null; try{ c=JSON.parse(lsGet("snapenv")||"null"); }catch(_){} if(!c||!c.ct) throw e; env=c; SNAP_STALE=true; }
      if(SNAP && SNAP._t===env.t){ SNAP_AT=Date.now(); return SNAP; }
      let pass=lsGet("fbkey"), msg="", prompted=false;
      for(;;){
        if(!pass){ prompted=true; pass=await askKey(msg); }
        try{ SNAP=await decryptEnv(env,pass); SNAP._t=env.t; lsSet("fbkey",pass); break; }
        catch(e){ if(e.code==="nocrypto"||e.code==="nozip") throw e; pass=null; lsDel("fbkey"); msg="Ключ не подошёл. Проверьте, что скопировали его из /appkey целиком."; }
      }
      SNAP_AT=Date.now(); if(prompted) setTimeout(()=>render(),0);          // окно ввода ключа заменило экран — перерисовать
      return SNAP;
    } finally { SNAP_P=null; }
  })();
  return SNAP_P;
}
function snapNote(){
  if(!STATIC||!SNAP) return "";
  const t=new Date(SNAP.generated_at), age=(Date.now()-t.getTime())/1000, old=age>6*3600;

async function staticApi(path){
  const S=await ensureSnap(); const u=new URL(path,"http://x"), p=u.pathname, q=u.searchParams;
  const nope=c=>{ const e=new Error("http "+c); e.code=c; return e; };
  if(p==="/api/matches"){
    const days=Math.max(1,Math.min(+q.get("days")||4,10)), lg=q.get("league")||"";
    const lim=new Date(Date.now()+days*864e5).toISOString().slice(0,10), d0=new Date().toISOString().slice(0,10);
    return S.matches.filter(m=>m.date>=d0 && m.date<=lim && (!lg||m.league===lg));
  }
  if(p.startsWith("/api/match/")){ const m=S.match[p.split("/").pop()]; if(!m) throw nope(404); return m; }
  if(p.startsWith("/api/analytics/")){ const m=S.match[p.split("/").pop()]; if(!m) throw nope(404); return m.analytics||{empty:true}; }   /* v41 */
  if(p.startsWith("/api/dna/")){ const m=S.match[p.split("/").pop()]; if(!m) throw nope(404); return m.dna||{empty:true}; }       /* v39 */
  if(p==="/api/bets"){

  }
  if(p==="/api/stats") return S.stats;
  if(p==="/api/today") return S.today;

  if(S[p.replace("/api/","")]!==undefined) return S[p.replace("/api/","")];      // новые разделы снимка (v25+)
  throw nope(404);
}

function when(m){

/* фаза матча по часам (v25). Живого счёта нет — это ОЦЕНКА от заявленного старта; зеркало matchphase.py (сверяется тестом) */
function phaseAt(t){
  if (t < 0) return {code:"pre", label:""};
  if (t < 47) { const n=Math.floor(t)+1; return n>45 ? {code:"1h", label:"1-й тайм ~45+′"} : {code:"1h", label:"1-й тайм ~"+n+"′"}; }
  if (t < 62) return {code:"ht", label:"перерыв"};
  if (t < 111) { const n=45+Math.floor(t-62)+1; return n>90 ? {code:"2h", label:"2-й тайм ~90+′"} : {code:"2h", label:"2-й тайм ~"+n+"′"}; }
  if (t < 360) return {code:"ft", label:"завершён · итог ожидается"};

}

/* обратный отсчёт до начала / фаза матча */

function heatmap(a, m){
  const mx=a.matrix; if(!mx||!mx.m) return "";
  const M=mx.m, K=M.length; let best=[0,0], bv=-1, vmax=0;
  M.forEach((r,i)=>r.forEach((v,j)=>{ if(v>bv){bv=v;best=[i,j];} vmax=Math.max(vmax,v); }));

  const tot=Array(K+1).fill(0); M.forEach((r,i)=>r.forEach((v,j)=>{ tot[Math.min(i+j,K)]+=v; })); tot[K]+=mx.rest||0;
  const tmax=Math.max(...tot);
  const tb = tot.map((v,k)=>`<div class="tb"><span class="muted">${k===K?K+"+":k}</span><div class="bar"><i style="width:${(v/tmax*100).toFixed(1)}%"></i></div><span class="num" style="text-align:right">${pc(v)}</span></div>`).join("");
  return `<div class="card"><div class="cap">Матрица счёта</div><div class="sub">вероятность каждого точного счёта (модель голов, %). Нажмите на клетку.</div>

    const bs=d.bus||{}, bc=x=>x?`<div class="wl41"><i class="w" style="flex-grow:${x.w}"></i><i class="d" style="flex-grow:${x.d}"></i><i class="l" style="flex-grow:${x.l}"></i></div><div class="kv"><span>В-Н-П</span><b>${x.w}-${x.d}-${x.l}</b></div><div class="kv"><span>Голы / xG</span><b>${N(x.gf)} / ${N(x.xg)}</b></div><div class="kv"><span>Удары</span><b>${N(x.shots)}</b></div>`:"";
    if(bs.home||bs.away) h+=`<div class="bx41 ${R()}"><h3>Против автобуса</h3><div class="tt">Игра против низкого блока</div>${two(m,bc(bs.home),bc(bs.away))}<div class="nt">${E((bs.home||bs.away).note)}</div></div>`;
    const co=d.corners||{}, cc=x=>x?`<div class="kv"><span>Угловые за / против</span><b>${N(x.cf)} / ${N(x.ca)}</b></div><div class="kv"><span>Лига</span><b>${N(x.lg)}</b></div><div class="kv"><span>Голов на 10 угловых</span><b>${N(x.g_per10)}</b></div><p>Угловое давление: ${E(x.level)}</p>`:"";
    if(co.home||co.away) h+=`<div class="bx41 ${R()}"><h3>Угроза со стандартов</h3><div class="tt">Угловое давление</div>${two(m,cc(co.home),cc(co.away))}<div class="nt">${E((co.home||co.away).note)}</div></div>`;
    const cl=d.clones;
    if(cl) h+=`<div class="bx41 ${R()}"><h3>Матчи-клоны</h3><div class="tt">${cl.n} похожих игр из ${cl.pool} (Elo и форма)</div><div class="wl41"><i class="w" style="flex-grow:${cl.w}"></i><i class="d" style="flex-grow:${cl.d}"></i><i class="l" style="flex-grow:${cl.l}"></i></div><div class="kv"><span>Хозяева · ничья · гости</span><b>${cl.w}% · ${cl.d}% · ${cl.l}%</b></div><div class="kv"><span>Голов за матч</span><b>${N(cl.goals,2)}</b></div><div class="kv"><span>Обе забили · Тотал 2.5Б</span><b>${cl.btts}% · ${cl.o25}%</b></div>${(cl.ex||[]).map(x=>`<div class="ex41"><span>${E(x.date.slice(2))} ${E(x.home)} — ${E(x.away)}</span><b>${x.hg}:${x.ag}</b></div>`).join("")}<div class="nt">Подбор: разница Elo ${cl.feat.elo_diff>0?"+":""}${cl.feat.elo_diff}, разница очков формы ${cl.feat.form_diff>0?"+":""}${cl.feat.form_diff}.</div></div>`;
    if(d.htft) h+=`<div class="bx41 ${R()}"><h3>Матрица HT/FT</h3><div class="tt">Нет данных о таймах</div><p>${E(d.htft.reason)}</p></div>`;
    return h; }

  function dnx(m,d){ K=0; let h="";
    const rf=d.referee;
    if(rf) h+=`<div class="bx41 ${R()}"><h3>Судья</h3><div class="tt">${E(rf.name)}${rf.lvl?` · ${E(rf.lvl)}`:""}</div>${rf.n>=5?`<div class="g2"><div><div class="kv"><span>Жёлтых за матч</span><b>${N(rf.yc,2)}</b></div><div class="kv"><span>Красных</span><b>${N(rf.rc,2)}</b></div></div><div><div class="kv"><span>Фолов</span><b>${N(rf.fouls)}</b></div><div class="kv"><span>Пенальти</span><b>${rf.pen==null?"—":N(rf.pen,2)}</b></div></div></div><div class="kv"><span>Карточки к норме лиги</span><b>${rf.cards_vs_lg==null?"—":"×"+N(rf.cards_vs_lg,2)}</b></div><div class="nt">По ${rf.n} матчам с этим судьёй из кэша.</div>`:`<p>Для статистики мало матчей с этим судьёй (${rf.n||0}).</p>`}</div>`;
    const mg=d.manager||{}, mc=x=>!x?"":x.n>=5?`<div class="kv"><span>${E(x.name)}</span><b>${x.n} матчей</b></div><div class="kv"><span>Очки / матч</span><b>${N(x.ppg,2)}</b></div><div class="kv"><span>В гостях</span><b>${x.away_ppg==null?"—":N(x.away_ppg,2)}</b></div><div class="kv"><span>Против топов</span><b>${x.top_ppg==null?"—":N(x.top_ppg,2)}</b></div><div class="kv"><span>Голы за / против</span><b>${N(x.gf,2)} / ${N(x.ga,2)}</b></div>`:`<div class="kv"><span>${E(x.name)}</span><b>мало данных</b></div>`;
    if(mg.home||mg.away) h+=`<div class="bx41 ${R()}"><h3>Тренеры</h3><div class="tt">Стиль в гостях и против топов</div>${two(m,mc(mg.home),mc(mg.away))}</div>`;
    const f=d.fatigue||{}, fc=x=>!x?"":`<div class="ft41"><i style="width:${x.idx}%;background:${x.idx>=60?"var(--red)":x.idx>=35?"var(--amber)":"var(--green)"}"></i></div><div class="kv"><span>Индекс</span><b>${x.idx}/100 · ${E(x.lvl)}</b></div><div class="kv"><span>Дней отдыха</span><b>${x.rest}</b></div><div class="kv"><span>Матчей за 14 / 30 дн.</span><b>${x.n14} / ${x.n30}</b></div><div class="kv"><span>Перелёт</span><b>${x.km==null?"—":x.km+" км"}</b></div>`;
    if(f.home||f.away) h+=`<div class="bx41 ${R()}"><h3>Индекс усталости</h3><div class="tt">Отдых, плотность, перелёты</div>${two(m,fc(f.home),fc(f.away))}<div class="nt">40% отдых (&lt;7 дн.), 35% плотность (3+ матча за 14 дн.), 25% перелёт (2500 км = максимум).</div></div>`;
    const st=d.style||{}, sc=x=>x&&x.tags&&x.tags.length?x.tags.map(t=>`<span class="tag41"><b>${E(t.t)}</b><span>${E(t.why)}</span></span>`).join(""):"";
    if(sc(st.home)||sc(st.away)) h+=`<div class="bx41 ${R()}"><h3>Playstyle DNA</h3><div class="tt">Стиль по последним 12 играм</div>${two(m,sc(st.home),sc(st.away))}</div>`;
    return h; }

  /* ───── 3. Встраивание в экран матча ───── */

    const eid=m.event_id; if(!eid||!v) return;

    getAn(eid).then(d=>{

      const hero=$(".hero",v), anchor=hero&&hero.closest(".card")||hero;
      if(d.conv){ const b=bento(d); if(anchor) anchor.insertAdjacentHTML("afterend",b); else v.insertAdjacentHTML("afterbegin",b); }
      const a=analysis(m,d), x=dnx(m,d);
      if(a) v.insertAdjacentHTML("beforeend",`<div class="an41">${a}</div>`);
      if(x) v.insertAdjacentHTML("beforeend",`<div class="dx41">${x}</div>`);

  window.V41={crest:window.crest,analysis,dnx,bento};
