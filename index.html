<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="fb-static" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Football Value</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#090d16;--bg2:#0d1321;--card:#131b2b;--card2:#1b2539;--line:#28354f;--text:#ecf1fa;--muted:#8c99b5;--dim:#626e8a;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--blue:#6096ff;--violet:#a78bfa;--track:#212d45;
  --r:20px;--pad:16px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden;
  background:radial-gradient(900px 340px at 50% -80px,rgba(96,150,255,.16),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}
h1{font-size:22px;margin:18px 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 .grow{flex:1}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)} .g{color:var(--green)} .r{color:var(--red)} .a{color:var(--amber)} .b{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.note b{color:var(--muted)}

/* ── анимации ── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.0)}50%{box-shadow:0 0 0 5px rgba(52,211,153,.18)}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.view{animation:fade .25s ease both}
.view.fwd{animation:slidein .32s var(--ease) both}
.view>*,.stag>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.pbar i,.meter i,.tb i{transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:.12s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .15s forwards}
.area{animation:fade .9s ease .5s both}
.row,.card.tap,.chip,.seg button,.nav button,.star{transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s}
.row:active,.card.tap:active{transform:scale(.985)}
.chip:active,.star:active{transform:scale(.93)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* навигация */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,19,33,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;padding:8px 4px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.nav button.on{color:var(--text);background:var(--card2)}
.nav button.on svg{transform:translateY(-1px) scale(1.12)}

/* фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px var(--pad) 10px;scrollbar-width:none;margin:0 calc(-1*var(--pad))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--card2);color:var(--text);border-color:var(--blue)}
.chip.fav.on{border-color:var(--amber);color:var(--amber)}
.chip.rec.on{border-color:var(--green);color:var(--green)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:11px;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:var(--text)}
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:10px;outline:0;transition:border-color .2s}
.search:focus{border-color:var(--blue)}
.tools{display:flex;gap:8px;align-items:center;margin:-2px 0 6px;flex-wrap:wrap}
.tools .sp{flex:1}
.sort{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.sort button{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.sort button.on{background:var(--card2);color:var(--text)}
.snapnote{font-size:12px;color:var(--dim);margin:6px 2px 12px;text-align:center}
.snapnote.warn{color:var(--amber)}
.iconbtn.lang{font-size:11px;font-weight:800;letter-spacing:.3px;color:var(--text);margin-right:8px}
.today .tp{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.today .tpm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:spin .8s linear infinite}

/* список матчей */
.day{margin:16px 2px 8px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.row:active{background:var(--card2)}
.row .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;gap:8px}
.row .top .eta{color:var(--blue);font-weight:600}
.teams{font-weight:700;font-size:16px;line-height:1.25}
.teams span{display:block}
.teams .fv{color:var(--amber);font-size:13px;margin-right:4px}
.pbar{display:flex;gap:3px;height:6px;margin:10px 0 6px;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%}
.pnum{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.bg-g{background:rgba(52,211,153,.14);color:var(--green)} .bg-a{background:rgba(251,191,36,.14);color:var(--amber)}
.bg-r{background:rgba(248,113,113,.14);color:var(--red)} .bg-b{background:rgba(96,150,255,.16);color:var(--blue)} .bg-m{background:var(--card2);color:var(--muted)}
.bg-g.pulse{animation:pulse 2.2s ease-in-out infinite}
html[data-theme=light]{--bg:#f3f5fa;--bg2:#e9edf5;--card:#ffffff;--card2:#eef2f9;--line:#d5dcea;--text:#141b2d;--muted:#5b6784;--dim:#8792ad;
  --green:#0f9f6e;--red:#d64545;--amber:#b7791f;--blue:#2f6bff;--violet:#7c5cf0;--track:#e1e7f2}
html[data-theme=light] body{background:radial-gradient(900px 340px at 50% -80px,rgba(47,107,255,.10),transparent 70%),var(--bg)}
.fd{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:4px;font-size:11px;font-weight:800;line-height:22px;text-align:center;color:#06101f}
.fd.W{background:var(--green)}.fd.D{background:var(--amber)}.fd.L{background:var(--red)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.tbl td.me,.tbl tr.me td{font-weight:800;color:var(--blue)}
.nbox{margin-top:8px}.nbox textarea{width:100%;min-height:54px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;resize:vertical}
.nlink{color:var(--blue);font-size:12px;margin-top:6px;display:inline-block}
.ntxt{margin-top:6px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.score{font-weight:700;font-size:20px;margin-top:8px;letter-spacing:.04em}
.pause{color:var(--amber,#e0a030)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1.2s infinite}

/* страница матча */
.hero{text-align:center;padding:20px 12px 18px;position:relative}
.hero .lg{display:inline-block;margin-bottom:10px}
.hero .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.hero .vs .at{margin-top:18px}
.mono{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:800;font-size:19px;border:2px solid currentColor;background:rgba(255,255,255,.04)}
.hero .tn.lg{font-size:15px}
.hero .tn .star{width:26px;height:26px}
.hero .tn{font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.hero .xg{font-size:12px;color:var(--muted);margin-top:4px}
.hero .at{color:var(--dim);font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.star{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--dim);margin-left:2px;vertical-align:middle}
.star svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.star.on{color:var(--amber)} .star.on svg{fill:currentColor}
.star.pop svg{animation:pop .4s var(--ease)}
.eta-big{margin-top:12px;font-size:13px;color:var(--blue);font-weight:700}
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.probs .p{font-size:clamp(22px,7.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.probs .k{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.probs .f{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;margin:0 0 12px}
.actions button{flex:1;padding:11px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px}
.actions button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions button:active{background:var(--card2);transform:scale(.97)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .v{font-weight:800;font-size:18px;margin:6px 0 2px}
.dots{display:flex;gap:5px;margin-top:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mk>div{background:var(--card2);border-radius:14px;padding:11px 12px}
.mk .t{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.mk .s{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px;font-weight:800}
.mk .s b{font-size:22px}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;border-radius:3px}
.mk .n{font-size:11px;font-weight:700;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}tr:last-child td{border-bottom:0}
.bet{border-left:4px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.bet:last-child{margin-bottom:0}.bet.rec{border-color:var(--green)}.bet.sk{border-color:var(--dim)}
.bet .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}.bet .h .o{flex:none;white-space:nowrap}.bet .mt{font-size:13px;color:var(--muted);margin-top:2px}
.bet .m{font-size:12.5px;color:var(--muted);margin-top:3px}

/* матрица счёта */
.hm{display:grid;grid-template-columns:22px repeat(6,1fr);gap:4px;margin-top:12px;font-size:12px}
.hm .ax{display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:11px}
.hm .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:var(--text);background:rgba(96,150,255,var(--a));border:1px solid transparent;cursor:pointer;transition:transform .15s,border-color .2s}
.hm .c.top{border-color:var(--amber)}
.hm .c.sel{border-color:var(--text);transform:scale(1.08);z-index:1}
.hm-info{margin-top:10px;min-height:20px;font-weight:700;font-size:14px;text-align:center}
.hm-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:10px 0 -4px 26px}
.tb{display:grid;grid-template-columns:34px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.tb .bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}.tb .bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
/* сравнение команд */
.cmp{margin-top:12px}
.cmp .r1{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.cmp .r1 .l{text-align:center;font-weight:600;font-size:12px;color:var(--muted)}
.cmp .r1 span:first-child{text-align:left}.cmp .r1 span:last-child{text-align:right}
.cmp .big{color:var(--text)}.cmp .small{color:var(--muted);font-weight:600}
.cmp .sp{display:flex;gap:3px;height:6px;margin:5px 0 12px;border-radius:3px;overflow:hidden}
.cmp .sp i{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
/* калькулятор */
.calc{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:10px}
.calc select,.calc input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);outline:0;min-width:0}
.calc input:focus,.calc select:focus{border-color:var(--blue)}
.calc-out{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-out>div{background:var(--card2);border-radius:12px;padding:10px 12px}
.calc-out .v{font-weight:800;font-size:18px;margin-top:3px}

/* статистика */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi .tile .v{font-size:26px}
.alert{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.alert.ok{border-left-color:var(--green)} .alert.neutral{border-left-color:var(--amber)}
.seg-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.seg-row:last-child{border-bottom:0}
.chartbox{position:relative;touch-action:pan-y}
svg.chart{width:100%;height:auto;display:block}
.tip{position:absolute;top:0;transform:translate(-50%,-6px);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.sumrow .badge{font-size:12px;padding:5px 11px;text-transform:none;letter-spacing:0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.skel{height:92px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--dim);font-size:12px;margin:18px 0}
.err{padding:28px 18px;text-align:center;margin-top:48px}
.err b{display:block;font-size:17px;margin-bottom:8px}
.btn{background:var(--blue);color:#06101f;font-weight:700;border-radius:12px;padding:10px 18px;margin-top:12px}
#ptr{position:fixed;top:8px;left:50%;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;
  opacity:0;pointer-events:none;z-index:30;transform:translateY(-60px)}
#ptr svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round}
#ptr.spin svg{animation:spin .7s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-weight:600;font-size:13px;z-index:40;display:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{display:block;animation:toastin .25s var(--ease) both}

/* ═════════ v26 «Эффекты»: живой фон, стекло, подсветка, акценты ═════════ */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ang{to{--ang:360deg}}
@keyframes rip{from{transform:scale(0);opacity:.35}to{transform:scale(1);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:none}
html[data-fx="on"] #fx{display:block}
html[data-fx="on"] body{background:none}
/* стекло: карточки полупрозрачные, фон просвечивает */
html[data-fx="on"] .card,html[data-fx="on"] .tile,html[data-fx="on"] .row,html[data-fx="on"] .seg,html[data-fx="on"] .chip,html[data-fx="on"] .search{
  background:color-mix(in srgb,var(--card) 70%,transparent)}
html[data-fx="on"] .nav{background:color-mix(in srgb,var(--bg2) 72%,transparent)}
html[data-fxl="max"] .card,html[data-fxl="max"] .tile,html[data-fxl="max"] .row{-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
html[data-fx="on"] .card,html[data-fx="on"] .tile,html[data-fx="on"] .row{border-color:color-mix(in srgb,var(--text) 10%,transparent);box-shadow:0 8px 28px -14px rgba(0,0,0,.55),inset 0 1px 0 color-mix(in srgb,var(--text) 7%,transparent)}
/* световое пятно под пальцем */
.card,.row,.tile{position:relative}
.card::after,.row::after,.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--blue) 28%,transparent),transparent 65%)}
html[data-fx="on"] .lit::after{opacity:1}
/* бегущий свет по рамке плиток KPI */
html[data-fxl="max"] .tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 72%,var(--blue) 86%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:ang 7s linear infinite;opacity:.9}
/* волна при нажатии */
.rip-host{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--blue) 55%,#fff);pointer-events:none;animation:rip .6s var(--ease) forwards}
html[data-fxl="off"] .rip{display:none}
/* заголовки с мягким градиентом */
html[data-fx="on"] h1{background:linear-gradient(92deg,var(--text) 30%,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html[data-fx="on"] h1 .iconbtn,html[data-fx="on"] h1 .badge{-webkit-text-fill-color:currentColor}
/* оформление: выбор фона и акцента */
.bgpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.bgpick button{aspect-ratio:1;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding:4px;text-shadow:0 1px 3px rgba(0,0,0,.7);transition:transform .2s var(--ease),border-color .2s}
.bgpick button.on{border-color:var(--text);transform:scale(1.06)}
.bgpick .b-aurora{background:radial-gradient(circle at 25% 30%,#2dd4bf,transparent 55%),radial-gradient(circle at 75% 35%,#7c5cf0,transparent 55%),radial-gradient(circle at 50% 90%,#2f6bff,transparent 60%),#0a1020}
.bgpick .b-nebula{background:radial-gradient(circle at 30% 70%,#c026d3,transparent 55%),radial-gradient(circle at 70% 25%,#3b82f6,transparent 55%),#070816}
.bgpick .b-grid{background:linear-gradient(#0b0620 45%,#ff2fa0 46%,#1b0b3c 47%),#0b0620}
.bgpick .b-pitch{background:radial-gradient(circle at 20% 0,#fff6,transparent 45%),radial-gradient(circle at 85% 0,#fff5,transparent 45%),#0a3b2a}
.bgpick .b-off{background:var(--card2);color:var(--muted);text-shadow:none}
.accpick{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.accpick button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bg);transition:transform .2s var(--ease)}
.accpick button.on{border-color:var(--text);transform:scale(1.15)}

/* ═════════ v27: живые матчи, кольцо вероятностей, плавающая навигация, недели ═════════ */
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.0),inset 0 0 0 1px rgba(52,211,153,.35)}50%{box-shadow:0 0 22px 2px rgba(52,211,153,.22),inset 0 0 0 1px rgba(52,211,153,.7)}}
@keyframes htpulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(251,191,36,.30)}50%{box-shadow:0 0 18px 1px rgba(251,191,36,.18),inset 0 0 0 1px rgba(251,191,36,.6)}}
.row{transition:height .55s cubic-bezier(.4,0,.2,1),opacity .45s,transform .55s,margin .55s,padding .55s}
.row.leaving{opacity:0;transform:scale(.94) translateX(40px);height:0!important;margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;overflow:hidden;border-width:0;pointer-events:none}
.row.is-done{opacity:.72}
.nowhead{display:flex;align-items:center;gap:8px;color:#34d399}
.row.is-live{animation:livepulse 2.2s ease-in-out infinite}
.row.is-ht{animation:htpulse 2.6s ease-in-out infinite}
html[data-fxl="off"] .row.is-live,html[data-fxl="off"] .row.is-ht{animation:none;box-shadow:inset 0 0 0 1px rgba(52,211,153,.5)}
@keyframes ringdraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes ringpop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.ring{display:block;margin:14px auto 2px;width:190px;height:190px;overflow:visible}
.ring .rseg{fill:none;stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--len) 999;stroke-dashoffset:var(--len);animation:ringdraw 1.1s var(--ease) forwards;animation-delay:var(--d,0s);filter:drop-shadow(0 0 6px var(--gl))}
.ring .trk{fill:none;stroke:var(--track);stroke-width:13;opacity:.6}
.ring .ctr{animation:ringpop .6s var(--ease) .5s both;transform-origin:center}
.ring .big{font-size:30px;font-weight:800;fill:var(--text)}
.ring .lab{font-size:12px;fill:var(--muted);letter-spacing:.06em}
.ringleg{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin-bottom:4px}
.ringleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* плавающая «пилюля» активной вкладки */
.nav{position:fixed}
.nav .pill{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom));left:0;width:0;border-radius:14px;background:var(--card2);z-index:0;transition:transform .45s cubic-bezier(.3,1.35,.5,1),width .3s var(--ease);pointer-events:none;box-shadow:0 0 18px -4px var(--blue)}
.nav.has-pill button{position:relative;z-index:1}
.nav.has-pill button.on{background:transparent}
@keyframes tabL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.view.bwd{animation:tabL .32s var(--ease) both}
/* предупреждение по слабому сегменту */
.segwarn{margin-top:8px;font-size:12px;color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:10px;padding:6px 9px;line-height:1.35}
/* недели */
.wk{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;align-items:end;height:120px;margin-top:14px}
.wk>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--dim);gap:4px}
.wk .bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:growy .9s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.wk .v{font-size:10px;font-weight:700}
#conf{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ═════════ v29 «Premium»: глубина, типографика, плавающая навигация, a11y ═════════ */
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  --font-d:"Manrope","Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --bg:#070a12;--bg2:#0b101c;--card:#111827;--card2:#1a2438;--line:#26334d;--text:#f1f5fc;
  --muted:#a9b5cd;--dim:#8f9bb5;           /* контраст на --card ≥ 7:1 и ≥ 5:1 (WCAG AA/AAA) */
  --sh1:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px -16px rgba(0,0,0,.7);
  --sh2:0 1px 0 rgba(255,255,255,.08) inset,0 18px 44px -18px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.02);
  --glow:color-mix(in srgb,var(--blue) 45%,transparent);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html[data-theme=light]{--muted:#4b5876;--dim:#65728f;--sh1:0 1px 0 #fff inset,0 10px 28px -16px rgba(30,45,90,.35);--sh2:0 1px 0 #fff inset,0 18px 40px -18px rgba(30,45,90,.45)}
html,body{font-family:var(--font);font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
h1,.hero .p,.tile .v,.score,.eta-big{font-family:var(--font-d)}
h1{font-weight:800;letter-spacing:-.025em;font-size:26px}
.cap{font-weight:700;letter-spacing:.09em;font-size:11.5px}
.num,.hero .p,.tile .v,.bet .o{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11"}
.tile .v{font-weight:800;font-size:24px;letter-spacing:-.02em}
body{padding-bottom:calc(112px + var(--safe-b))}

/* карточки: глубина и «стекло» */
.card,.row,.tile{box-shadow:var(--sh1);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s,background .3s}
.card{border-radius:22px;padding:18px;margin-bottom:14px}
.row{border-radius:20px;padding:15px 16px;margin-bottom:12px}
@media (hover:hover){.row:hover,.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2),0 0 0 1px var(--glow);border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}}
.row:active{transform:scale(.985)}
.row .teams{font-family:var(--font-d);font-weight:700;font-size:16.5px;letter-spacing:-.015em}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--card2) 85%,var(--blue)),var(--card) 70%);box-shadow:var(--sh2);transform-style:preserve-3d;will-change:transform}
.hero.tilting{transition:transform .08s linear}
.hero:not(.tilting){transition:transform .6s var(--ease)}
.hero .sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--sx,50%) var(--sy,0%),rgba(255,255,255,.16),transparent 60%)}
.hero.tilting .sheen{opacity:1}

/* прогресс-бары: свечение + шкала */
.pbar{height:8px;border-radius:6px;background:var(--track)}
.pbar i{box-shadow:0 0 12px -2px currentColor;position:relative;border-radius:2px}
.pbar i:first-child{box-shadow:0 0 14px -2px var(--glow)}

/* чипы, переключатели, кнопки: зона нажатия ≥ 44px */
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-size:13.5px}
.seg button{min-height:44px}
.sort button{min-height:36px;position:relative}
.sort button::after,.iconbtn::after{content:"";position:absolute;inset:-4px}
.iconbtn{width:44px;height:44px;position:relative;box-shadow:var(--sh1);transition:transform .2s var(--ease),border-color .2s}
.iconbtn:active{transform:scale(.9)}
.tools{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto;gap:8px;scrollbar-width:none;margin-left:calc(-1*var(--pad));margin-right:calc(-1*var(--pad));padding:2px var(--pad) 12px;align-items:center}
.tools::-webkit-scrollbar{display:none}.tools>*{flex:none}.tools .sp{flex:1 0 0;min-width:0}
.bet,.btn,.actions button{min-height:44px}
.chip.on,.seg button.on{box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 60%,transparent),0 6px 18px -8px var(--glow)}
button:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.search{min-height:48px;border-radius:16px;font-size:15px}

/* плавающая стеклянная навигация */
.nav{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(10px + var(--safe-b));border-radius:28px;padding:8px;
  border:1px solid color-mix(in srgb,var(--text) 12%,transparent);
  background:color-mix(in srgb,var(--bg2) 66%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 22px 50px -14px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.1) inset,0 0 38px -16px var(--glow);
  max-width:520px;margin:0 auto}
html[data-fx="on"] .nav{background:color-mix(in srgb,var(--bg2) 58%,transparent)}
.nav button{min-height:52px;border-radius:20px;font-size:11.5px;letter-spacing:.01em;padding:7px 4px}
.nav button.on{color:var(--text)}
.nav button.on svg{filter:drop-shadow(0 0 7px var(--blue));stroke:var(--blue)}
.nav .pill{top:8px;bottom:8px;border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 22%,var(--card2)),var(--card2));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent),0 8px 22px -8px var(--glow)}
#toast{bottom:calc(100px + var(--safe-b))}

/* липкая мини-шапка */
#mini{position:fixed;top:0;left:0;right:0;z-index:25;padding:calc(8px + var(--safe-t)) 16px 8px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-d);font-weight:800;font-size:15.5px;letter-spacing:-.01em;
  background:color-mix(in srgb,var(--bg2) 70%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border-bottom:1px solid color-mix(in srgb,var(--text) 9%,transparent);transform:translateY(-110%);opacity:0;transition:transform .35s var(--ease),opacity .25s;pointer-events:none}
#mini.on{transform:none;opacity:1}
#mini i{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}

/* появление карточек при прокрутке */
.rv{opacity:0;transform:translateY(18px) scale(.985)}
.rv.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .7s var(--ease);transition-delay:var(--rd,0ms)}
html[data-fxl="off"] .rv{opacity:1;transform:none}

/* скелетоны: переливание */
.skel{height:112px;border-radius:20px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--card) 90%,transparent) 20%,color-mix(in srgb,var(--card2) 95%,#fff 3%) 50%,color-mix(in srgb,var(--card) 90%,transparent) 80%);background-size:220% 100%;animation:sh 1.4s linear infinite}
.skel::before{content:"";position:absolute;left:16px;top:16px;width:38%;height:11px;border-radius:6px;background:color-mix(in srgb,var(--text) 9%,transparent)}
.skel::after{content:"";position:absolute;left:16px;right:16px;bottom:18px;height:8px;border-radius:5px;background:color-mix(in srgb,var(--text) 9%,transparent)}

/* пустые состояния */
.empty{padding:44px 16px;font-size:15px;animation:emptyin .7s var(--ease) both}
.empty::before{content:"";display:block;width:76px;height:76px;margin:0 auto 14px;border-radius:24px;opacity:.9;
  background:color-mix(in srgb,var(--blue) 12%,transparent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236096ff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='8.5'/><path d='M12 7.5l3.6 2.6-1.4 4.2H9.8L8.4 10.1z'/></svg>") center/46px no-repeat;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 30%,transparent),0 14px 34px -14px var(--glow);animation:float 4s ease-in-out infinite}
@keyframes emptyin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* график */
.chartbox .tip{background:color-mix(in srgb,var(--card2) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--sh2);border-radius:12px;padding:7px 11px;font-weight:700}
.chart .draw{filter:drop-shadow(0 0 6px var(--lc,#9aa7c7))}
@media (max-width:360px){h1{font-size:23px}.tile .v{font-size:21px}.row .teams{font-size:15.5px}}

/* ═════════ v30 «Next-Level»: пружины, шум, bento, шторки, контейнерные запросы ═════════ */
@property --gx{syntax:'<number>';initial-value:0;inherits:true}
@property --gy{syntax:'<number>';initial-value:0;inherits:true}
:root{--spring:cubic-bezier(.34,1.45,.5,1);--spring-d:.7s}
.row,.tile{transition:height .55s var(--ease),opacity .45s,transform var(--spring-d) var(--spring),margin .55s,padding .55s,box-shadow .35s var(--ease),border-color .3s,background .3s}
.card{transition:transform var(--spring-d) var(--spring),box-shadow .35s var(--ease),border-color .3s,background .3s}
.chip,.seg button,.sort button,.actions button,.iconbtn,.nav button{transition:transform .5s var(--spring),background .25s,color .25s,box-shadow .3s,border-color .25s}
.row:active,.card:active{transform:scale(.982)}
.chip:active,.iconbtn:active,.actions button:active{transform:scale(.92)}
.nav .pill{transition:transform var(--spring-d) var(--spring),width .45s var(--spring)}
.view.fwd,.view.bwd{animation-duration:.55s;animation-timing-function:var(--spring)}
/* долгое нажатие */
.lp{transform:scale(1.035)!important;box-shadow:0 0 0 1.5px var(--blue),0 18px 46px -12px var(--glow)!important;z-index:2}

/* матовая плёнка шума */
#noise{position:fixed;inset:-24px;z-index:3;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-position:calc(var(--gx,0)*18px) calc(var(--gy,0)*18px)}
html[data-theme=light] #noise{opacity:.04}
/* параллакс по наклону */
.hero{translate:calc(var(--gx,0)*-6px) calc(var(--gy,0)*-5px)}
.ring{translate:calc(var(--gx,0)*5px) calc(var(--gy,0)*4px)}
/* стекло: «преломление» — градиентная рамка, угол зависит от наклона */
html[data-fxl="max"] .card:not(.empty)::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;opacity:.85;
  background:conic-gradient(from calc(var(--ang) + var(--gx,0)*70deg),transparent 0 58%,color-mix(in srgb,var(--blue) 75%,transparent) 76%,rgba(255,255,255,.42) 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ang 14s linear infinite}
html[data-fxl="max"] .nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 40%)}

/* Bento: главные метрики крупнее */
.kpi .tile:first-child{grid-column:1/-1;display:flex;flex-direction:column;justify-content:center;padding:16px 18px}
.kpi .tile:first-child .v{font-size:clamp(36px,11vw,56px);letter-spacing:-.035em;line-height:1.05}
.today .tiles{grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto}
.today .tiles .tile:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.today .tiles .tile:first-child .v{font-size:clamp(40px,12vw,62px);letter-spacing:-.04em;line-height:1}
/* fluid typography */
h1{font-size:clamp(23px,calc(17px + 2.2vw),34px)}
.row .teams{font-size:clamp(15.5px,calc(13px + .85vw),19px)}
.tile .v{font-size:clamp(20px,calc(15px + 1.6vw),30px)}
.hero .tn{font-size:clamp(15px,calc(12px + .9vw),20px)}
.ring .big{font-size:clamp(28px,8vw,38px)}
.sub{font-size:clamp(12.5px,calc(11px + .45vw),14.5px)}
/* контейнерные запросы: сетка перестраивается по ширине контейнера, а не экрана */
#app{container:app/inline-size}
@container app (min-width:600px){
  #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
  #list>.day,#list>.nowhead,#list>.empty{grid-column:1/-1}
  .kpi{grid-template-columns:repeat(4,1fr)} .kpi .tile:first-child{grid-column:span 2}
  .mk{grid-template-columns:repeat(4,1fr)}
}
@container app (min-width:920px){#list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:700px){.wrap{max-width:min(1080px,100%)}.nav{max-width:560px}}
/* складные устройства: сетка огибает сгиб */
@media (horizontal-viewport-segments:2){
  #list{display:grid!important;grid-template-columns:1fr 1fr;column-gap:calc(env(viewport-segment-left 1 0,50vw) - env(viewport-segment-right 0 0,50vw) + 12px)}
  #list>.day,#list>.nowhead,#list>.empty{grid-column:1/-1}
}

/* потянуть для обновления: «сфера» */
#ptr{width:46px;height:46px;margin-left:-23px;border:0;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85),var(--blue) 42%,color-mix(in srgb,var(--blue) 35%,#000));
  box-shadow:0 0 26px var(--glow),inset 0 -7px 14px rgba(0,0,0,.35);scale:1 var(--sy,1);transition:opacity .25s,transform .45s var(--spring)}
#ptr svg{stroke:#fff;width:20px;height:20px}
#ptr.armed{box-shadow:0 0 38px var(--blue),inset 0 -7px 14px rgba(0,0,0,.35)}
#ptr.spin{animation:orb 1s ease-in-out infinite}
#ptr.spin svg{animation:spin .9s linear infinite}
@keyframes orb{0%,100%{transform:translateY(22px) scale(1)}50%{transform:translateY(30px) scale(1.2)}}

/* плавное перетекание чисел */
.flowup{animation:fup 1.5s ease-out}.flowdn{animation:fdn 1.5s ease-out}
@keyframes fup{0%{text-shadow:0 0 14px #34d399;color:#34d399}100%{text-shadow:0 0 0 transparent}}
@keyframes fdn{0%{text-shadow:0 0 14px #f87171;color:#f87171}100%{text-shadow:0 0 0 transparent}}
#cl,#cc{transition:opacity .25s}
.ring .rseg{cursor:pointer;pointer-events:stroke}
.ringleg span{cursor:pointer;padding:6px 4px;min-height:32px;display:inline-flex;align-items:center;gap:6px}

/* шторка снизу */
#sheetbg{position:fixed;inset:0;z-index:70;background:rgba(2,4,10,.5);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);opacity:0;pointer-events:none;transition:opacity .35s}
#sheetbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:640px;margin:0 auto;max-height:84vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;

/* копилот */
#fab{position:fixed;right:16px;bottom:calc(104px + var(--safe-b,0px));z-index:30;width:56px;height:56px;border-radius:20px;border:0;display:grid;place-items:center;font-size:24px;color:#fff;cursor:pointer;

.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

.ach .bd .pr{height:4px;border-radius:3px;background:var(--track,rgba(255,255,255,.08));margin-top:7px;overflow:hidden}.ach .bd .pr i{display:block;height:100%;background:var(--blue);border-radius:3px}

#achT{position:fixed;left:50%;top:calc(12px + max(env(safe-area-inset-top,0px),var(--tg-top,0px)));z-index:90;transform:translate(-50%,-140%);display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:24px;
  background:color-mix(in srgb,var(--bg2) 70%,transparent);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:1px solid color-mix(in srgb,var(--blue) 55%,transparent);box-shadow:0 20px 50px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .8s var(--spring);max-width:92vw}

/* ─────────── утилиты ─────────── */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function countUp(root){
  (root||document).querySelectorAll("[data-count]").forEach(el=>{
    const to=parseFloat(el.dataset.count), d=+el.dataset.dec||0, suf=el.dataset.suf||"", sign=el.dataset.sign==="1";
    const fmt=v=>(sign&&v>=0?"+":"")+v.toFixed(d)+suf;
    if(RM||!isFinite(to)){ el.textContent=fmt(to); return; }
    const t0=performance.now(), dur=800; el.textContent=fmt(0);
    (function f(t){const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(to*e); if(k<1) requestAnimationFrame(f); else el.textContent=fmt(to);})(t0);
  });
}

const store = {
  cloud(){ try{ return !!(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")); }catch(e){ return false; } },
  ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  get(k){ return new Promise(res=>{ const l=this.ls(k); if(!this.cloud()) return res(l);
    let done=false; const t=setTimeout(()=>{ if(!done){done=true;res(l);} },1500);
    try{ tg.CloudStorage.getItem(k,(err,v)=>{ if(done) return; done=true; clearTimeout(t); res(!err&&v?v:l); }); }catch(e){ res(l); } }); },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} try{ if(this.cloud()) tg.CloudStorage.setItem(k,v,()=>{}); }catch(e){} }
};

const normKey = p=>String(p||"").replace(/[\s\-]/g,"").toUpperCase();
const unb64 = s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptEnv(env, pass){
  if(!(window.crypto&&crypto.subtle)){ const e=new Error("nocrypto"); e.code="nocrypto"; throw e; }
  const enc=new TextEncoder(), salt=unb64(env.salt), iv=unb64(env.iv), ct=unb64(env.ct);
  const km=await crypto.subtle.importKey("raw", enc.encode(normKey(pass)), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:env.iter,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  let buf=await crypto.subtle.decrypt({name:"AES-GCM",iv,additionalData:enc.encode("fbapp1")}, key, ct);   // неверный ключ → исключение
  if(env.z){
    if(typeof DecompressionStream==="undefined"){ const e=new Error("nozip"); e.code="nozip"; throw e; }
    buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
  }
  return JSON.parse(new TextDecoder().decode(buf));
}
function askKey(msg){

      <div class="muted" style="margin:6px 0 12px">Данные приложения зашифрованы. Введите ключ один раз — он запомнится на этом телефоне.<br>Ключ покажет бот по команде <b>/appkey</b>.</div>

    const go=()=>{ const v=document.getElementById("keyin").value; if(normKey(v).length>=12) res(v); };
    document.getElementById("keyok").onclick=go;

function ensureSnap(maxAge=45000){
  if(SNAP && Date.now()-SNAP_AT<maxAge) return Promise.resolve(SNAP);
  if(SNAP_P) return SNAP_P;
  SNAP_P=(async()=>{
    try{
      let env;
      try{
        const r=await fetch("snapshot.enc.json?t="+Date.now(),{cache:"no-store"});
        if(!r.ok){ const e=new Error("http "+r.status); e.code=r.status===404?"nosnap":r.status; throw e; }
        env=await r.json();
      }catch(e){ if(SNAP) return SNAP; throw e; }
      if(SNAP && SNAP._t===env.t){ SNAP_AT=Date.now(); return SNAP; }
      let pass=lsGet("fbkey"), msg="", prompted=false;
      for(;;){
        if(!pass){ prompted=true; pass=await askKey(msg); }
        try{ SNAP=await decryptEnv(env,pass); SNAP._t=env.t; lsSet("fbkey",pass); break; }
        catch(e){ if(e.code==="nocrypto"||e.code==="nozip") throw e; pass=null; lsDel("fbkey"); msg="Ключ не подошёл. Проверьте, что скопировали его из /appkey целиком."; }
      }
      SNAP_AT=Date.now(); if(prompted) setTimeout(()=>render(),0);          // окно ввода ключа заменило экран — перерисовать
      return SNAP;
    } finally { SNAP_P=null; }
  })();
  return SNAP_P;
}
function snapNote(){
  if(!STATIC||!SNAP) return "";
  const t=new Date(SNAP.generated_at), age=(Date.now()-t.getTime())/1000, old=age>6*3600;
  return `<div class="snapnote${old?" warn":""}">данные на ${fmtTime(t)} · ${ago(SNAP.generated_at)}${old?" · ноутбук давно не публиковал, цифры могли устареть":""}</div>`;
}
async function staticApi(path){
  const S=await ensureSnap(); const u=new URL(path,"http://x"), p=u.pathname, q=u.searchParams;
  const nope=c=>{ const e=new Error("http "+c); e.code=c; return e; };
  if(p==="/api/matches"){
    const days=Math.max(1,Math.min(+q.get("days")||4,10)), lg=q.get("league")||"";
    const lim=new Date(Date.now()+days*864e5).toISOString().slice(0,10), d0=new Date().toISOString().slice(0,10);
    return S.matches.filter(m=>m.date>=d0 && m.date<=lim && (!lg||m.league===lg));
  }
  if(p.startsWith("/api/match/")){ const m=S.match[p.split("/").pop()]; if(!m) throw nope(404); return m; }
  if(p==="/api/bets"){
    const st=q.get("status")||"all", lim=Math.max(1,Math.min(+q.get("limit")||100,500));
    return S.bets.filter(b=>st==="open"?b.result==null:st==="settled"?b.result!=null:true).slice(0,lim);
  }
  if(p==="/api/stats") return S.stats;
  if(p==="/api/today") return S.today;
  if(p==="/api/me") return S.me;
  if(S[p.replace("/api/","")]!==undefined) return S[p.replace("/api/","")];      // новые разделы снимка (v25+)
  throw nope(404);
}

async function api(path){
  if (STATIC) return staticApi(path);
  const r = await fetch(path,{headers:{"X-Telegram-Init-Data":(tg&&tg.initData)||""}});
  if (r.status===401) { const e = new Error("auth"); e.code=401; throw e; }
  if (r.status===429) { const e = new Error("rate"); e.code=429; throw e; }
  if (!r.ok) { const e = new Error("http "+r.status); e.code=r.status; throw e; }
  return r.json();
}

function when(m){

  return {d, hasTime: !!m.kickoff_at};

const fmtDay = d=>{const t=new Date(),y=new Date(Date.now()+864e5),s=x=>x.toDateString();
  if (s(d)===s(t)) return "Сегодня"; if (s(d)===s(y)) return "Завтра";
  return d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});};
const fmtTime = d=>d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function ago(iso){ if(!iso) return ""; const s=(Date.now()-new Date(iso).getTime())/1000; if(s<90) return "только что"; if(s<3600) return Math.round(s/60)+" мин назад";
  if(s<86400) return Math.round(s/3600)+" ч назад"; return Math.round(s/86400)+" дн назад"; }
/* фаза матча по часам (v25). Живого счёта нет — это ОЦЕНКА от заявленного старта; зеркало matchphase.py (сверяется тестом) */
function phaseAt(t){
  if (t < 0) return {code:"pre", label:""};
  if (t < 47) { const n=Math.floor(t)+1; return n>45 ? {code:"1h", label:"1-й тайм ~45+′"} : {code:"1h", label:"1-й тайм ~"+n+"′"}; }
  if (t < 62) return {code:"ht", label:"перерыв"};
  if (t < 111) { const n=45+Math.floor(t-62)+1; return n>90 ? {code:"2h", label:"2-й тайм ~90+′"} : {code:"2h", label:"2-й тайм ~"+n+"′"}; }
  if (t < 360) return {code:"ft", label:"завершён · итог ожидается"};
  return {code:"old", label:""};
}
function phaseOf(ms){ return phaseAt((Date.now()-ms)/60000); }
/* обратный отсчёт до начала / фаза матча */
function etaText(ms){
  const diff = ms - Date.now(), m = Math.round(Math.abs(diff)/60000);
  if (diff > 0) { if (m < 1) return "сейчас начнётся"; if (m < 60) return "через "+m+" мин"; const h=Math.floor(m/60); if (h < 24) return "через "+h+" ч"+(m%60?" "+(m%60)+" мин":""); return ""; }
  return phaseOf(ms).label;
}

const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z"/></svg>';
function starBtn(team){ return `<button class="star ${isFav(team)?"on":""}" data-fav="${esc(team)}" aria-label="В избранное">${STAR}</button>`; }

function heatmap(a, m){
  const mx=a.matrix; if(!mx||!mx.m) return "";
  const M=mx.m, K=M.length; let best=[0,0], bv=-1, vmax=0;
  M.forEach((r,i)=>r.forEach((v,j)=>{ if(v>bv){bv=v;best=[i,j];} vmax=Math.max(vmax,v); }));
  let cells = '<div class="ax" style="font-size:9px">хоз↓</div>'+Array.from({length:K},(_,j)=>`<div class="ax">${j}</div>`).join("");
  M.forEach((r,i)=>{ cells += `<div class="ax">${i}</div>` + r.map((v,j)=>`<div class="c ${i===best[0]&&j===best[1]?"top":""}" data-i="${i}" data-j="${j}" data-v="${v}" style="--a:${(0.06+0.78*(v/vmax)).toFixed(2)}">${v>=.01?Math.round(v*100):""}</div>`).join(""); });
  // распределение суммы голов
  const tot=Array(K+1).fill(0); M.forEach((r,i)=>r.forEach((v,j)=>{ tot[Math.min(i+j,K)]+=v; })); tot[K]+=mx.rest||0;
  const tmax=Math.max(...tot);
  const tb = tot.map((v,k)=>`<div class="tb"><span class="muted">${k===K?K+"+":k}</span><div class="bar"><i style="width:${(v/tmax*100).toFixed(1)}%"></i></div><span class="num" style="text-align:right">${pc(v)}</span></div>`).join("");
  return `<div class="card"><div class="cap">Матрица счёта</div><div class="sub">вероятность каждого точного счёта (модель голов, %). Нажмите на клетку.</div>
    <div class="hm-lab"><span>голы гостей →</span><span></span></div>
    <div class="hm" id="hm">${cells}</div><div class="hm-info" id="hmi"><span class="muted">Самый вероятный: ${best[0]}:${best[1]} — ${pc(bv,1)}</span></div>
    <div class="cap" style="margin-top:16px">Всего голов в матче</div>${tb}
    <div class="note">Слева — голы хозяев (${esc(nmH(m))}), сверху — голы гостей. Это распределение из модели голов (Пуассон + поправка Диксона–Коулза); оно задаёт рынки тоталов и «обе забьют», а итоговые П1/Х/П2 выше считает ансамбль, поэтому суммы по матрице могут немного отличаться.</div></div>`;
}
function compare(a, m){
  const H=a.form&&a.form.home, A=a.form&&a.form.away; if(!H||!A) return "";
  const rows=[["xg_for","Атака · xG за матч"],["xg_against","Защита · xG пропущено"],["corners_for","Угловые за матч"],["corners_against","Угловые пропущено"],["cards_for","Карточки за матч"],["cards_against","Карточки против"]]
    .filter(([k])=>H[k]!=null&&A[k]!=null);
  if(!rows.length) return "";
  return `<div class="card"><div class="cap">Сравнение команд</div><div class="sub">средние показатели за матч · <span class="b">${esc(nmH(m))}</span> / <span style="color:var(--violet)">${esc(nmA(m))}</span></div><div class="cmp">`+
    rows.map(([k,l])=>{ const h=H[k],x=A[k],t=(h+x)||1; return `<div class="r1"><span class="num ${h>=x?"big":"small"}">${h.toFixed(2)}</span><span class="l">${l}</span><span class="num ${x>=h?"big":"small"}">${x.toFixed(2)}</span></div>
      <div class="sp"><i style="width:${(h/t*100).toFixed(1)}%;background:var(--blue)"></i><i style="width:${(x/t*100).toFixed(1)}%;background:var(--violet)"></i></div>`; }).join("")+`</div></div>`;
}
function calcCard(a){
  const opts=[["P1","П1 (победа хозяев)",a.p[0]],["X","Х (ничья)",a.p[1]],["P2","П2 (победа гостей)",a.p[2]]];
  const f=a.forecasts||{};
  if(f["TB_2.5"]&&f["TB_2.5"].p_over!=null){ opts.push(["TB","Тотал больше 2.5",f["TB_2.5"].p_over],["TM","Тотал меньше 2.5",1-f["TB_2.5"].p_over]); }
  if(f["BTTS"]&&f["BTTS"].p_over!=null){ opts.push(["BY","Обе забьют — да",f["BTTS"].p_over],["BN","Обе забьют — нет",1-f["BTTS"].p_over]); }
  return `<div class="card"><div class="cap">Проверить кэф</div><div class="sub">введите кэф букмекера — покажу, как он выглядит против модели</div>
   <div class="calc"><select id="cs">${opts.map(([k,t,p])=>`<option value="${p}">${esc(t)}</option>`).join("")}</select><input id="ci" inputmode="decimal" placeholder="кэф" autocomplete="off"></div>
   <div id="co"></div>
   <div class="note"><b>Ориентир по модели.</b> Бот дополнительно учитывает маржу рынка, цену Pinnacle и подтверждённые сегменты — его решение о ставке приоритетнее.</div></div>`;
}
function calcUpdate(){
  const sel=document.getElementById("cs"), inp=document.getElementById("ci"), out=document.getElementById("co"); if(!sel||!inp||!out) return;
  const p=parseFloat(sel.value), o=parseFloat(String(inp.value).replace(",","."));
  if(!(o>1)||!(p>0)){ out.innerHTML=""; return; }
  const ev=p*o-1, imp=1/o, evc=ev>=.02?"g":ev<=-.02?"r":"a";
  out.innerHTML=`<div class="calc-out"><div><div class="cap">Модель даёт</div><div class="v num">${pc(p,1)}</div></div><div><div class="cap">Кэф требует</div><div class="v num">${pc(imp,1)}</div></div>
   <div><div class="cap">EV по модели</div><div class="v num ${evc}">${sgn(ev)}</div></div><div><div class="cap">Кэф без перевеса</div><div class="v num">${fair(p)}</div></div></div>
   ${ev>.15?'<div class="note" style="color:var(--amber)">EV выше 15% почти всегда значит ошибку в кэфе или нехватку данных, а не реальный перевес.</div>':""}`;
}

/* ═════════ v26: движок живого фона и эффектов ═════════

const FX = (()=>{

  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  let mode="aurora", level="max", raf=0, t0=performance.now(), last=0, W=0, H=0, stars=[], tilt={x:0,y:0}, ptr=null;
  const get=(k,d)=>lsGet(k)||d;
  const hex=(h,a)=>{ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
  const isLight=()=>document.documentElement.dataset.theme==="light";
  const accent=()=>ACC[get("acc","blue")]||ACC.blue;
  function size(){
    const sc = level==="max" ? (mode==="grid"||mode==="nebula"?.6:.4) : .28;
    W = Math.max(60,Math.round(innerWidth*sc)); H = Math.max(80,Math.round(innerHeight*sc));
    cv.width=W; cv.height=H; cv.style.imageRendering="auto";
    stars = Array.from({length: level==="max"?90:40}, ()=>({x:Math.random(),y:Math.random(),z:.2+Math.random()*.8,p:Math.random()*6.28}));
  }
  /* ── аврора: большие светящиеся пятна ── */
  function aurora(t){
    const L=isLight(), a=accent();
    cx.globalCompositeOperation="source-over"; cx.fillStyle=L?"#eef2fa":"#070b15"; cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation=L?"multiply":"lighter";
    const cols=[a,"#7c5cf0","#2dd4bf","#3b82f6","#c026d3"], R=Math.max(W,H)*(L?.55:.62), k=L?.28:.34;
    for(let i=0;i<5;i++){
      const ph=i*1.7, x=W*(.5+.42*Math.sin(t*.00011*(1+i*.23)+ph)) + tilt.x*W*.05*(i%2?1:-1), y=H*(.5+.42*Math.cos(t*.00009*(1+i*.31)+ph*1.3)) + tilt.y*H*.04;

  }
  /* ── туманность + звёзды с параллаксом ── */
  function nebula(t){

    cx.fillStyle="#fff";
    for(const s of stars){
      const tw=.45+.55*Math.sin(t*.002*s.z+s.p), x=((s.x*W + tilt.x*W*.06*s.z + t*.004*s.z)%W+W)%W, y=(s.y*H + tilt.y*H*.05*s.z)%H;

    const sky=cx.createLinearGradient(0,0,0,hz); sky.addColorStop(0,"#05020f"); sky.addColorStop(1,"#2a0a4a");
    cx.fillStyle=sky; cx.fillRect(0,0,W,hz);

    cx.fillStyle=sun; cx.fillRect(0,0,W,hz+4);
    cx.lineWidth=1; cx.strokeStyle=hex(a,.75);
    for(let i=-14;i<=14;i++){ cx.beginPath(); cx.moveTo(W/2+i*W*.02,hz); cx.lineTo(W/2+i*W*.22,H); cx.stroke(); }
    const sp=(t*.00035)%1;
    for(let i=0;i<14;i++){ const f=((i+sp)/14), y=hz+(H-hz)*f*f; cx.globalAlpha=.25+.75*f; cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }

      const gl=cx.createLinearGradient(bx,0,x2,y2); gl.addColorStop(0,"rgba(255,255,230,.26)"); gl.addColorStop(1,"rgba(255,255,230,0)");
      cx.fillStyle=gl; cx.beginPath(); cx.moveTo(bx,0); cx.lineTo(x2-dir*W*.25,y2); cx.lineTo(x2+dir*W*.25,y2); cx.closePath(); cx.fill();
    }

  const DRAW={aurora,nebula,grid,pitch};
  function frame(now){
    raf=requestAnimationFrame(frame);
    const fps=level==="max"?33:50; if(now-last<fps) return; last=now;

      sp.className="rip"; sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-b.left-d/2}px;top:${e.clientY-b.top-d/2}px`; bt.appendChild(sp); setTimeout(()=>sp.remove(),650); }
  },{passive:true});
  applyAccent(); start();
  return {start, applyAccent, recolor(){ if(document.documentElement.dataset.fx==="on") size(); }};
})();
const BGS=[["aurora","Аврора"],["nebula","Космос"],["grid","Неон"],["pitch","Стадион"],["off","Без фона"]];
const ACCS=[["tg",(tg&&tg.themeParams&&tg.themeParams.button_color)||"#3390ec"],["blue","#6096ff"],["teal","#2dd4bf"],["violet","#a78bfa"],["pink","#f472b6"],["orange","#fb923c"]];
